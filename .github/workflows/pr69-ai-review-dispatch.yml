name: PR69 AI Review Dispatcher

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  dispatch:
    if: ${{ github.event.pull_request.number == 69 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch combined Gemini and DeepSeek review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" -f event_type=pr69-ai-review >/dev/null
          echo "Dispatched repository event pr69-ai-review for PR #69"
