name: PR69 AI Review Dispatcher

on:
  pull_request:
    types: [synchronize]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: ${{ github.event.pull_request.number == 69 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch combined Gemini and DeepSeek review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run pr69-external-reviews-manual.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Dispatched combined Gemini and DeepSeek review for PR #69"
