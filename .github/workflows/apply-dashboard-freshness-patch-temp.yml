name: Apply dashboard freshness patch (temporary)

on:
  push:
    branches:
      - copilot/dashboard-freshness-corrections
    paths:
      - .github/workflows/apply-dashboard-freshness-patch-temp.yml
      - .github/patches/dashboard-freshness-corrections_v2.part00
      - .github/patches/dashboard-freshness-corrections_v2.part01
      - .github/patches/dashboard-freshness-corrections_v2.part02
      - .github/patches/dashboard-freshness-corrections_v2.part03
      - .github/patches/dashboard-freshness-corrections_v2.part04
      - .github/patches/dashboard-freshness-corrections_v2.part05

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: opip_test
          POSTGRES_PASSWORD: test_password_min_20_chars_long
          POSTGRES_DB: opip_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      APP_ENV: test
      OPIP_TEST_DATABASE_URL: postgresql://opip_test:test_password_min_20_chars_long@localhost:5432/opip_test
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: copilot/dashboard-freshness-corrections
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: OHM-Trade-Agent-v1/requirements.txt

      - name: Reassemble and verify patch
        run: |
          set -euo pipefail
          cat \
            .github/patches/dashboard-freshness-corrections_v2.part00 \
            .github/patches/dashboard-freshness-corrections_v2.part01 \
            .github/patches/dashboard-freshness-corrections_v2.part02 \
            .github/patches/dashboard-freshness-corrections_v2.part03 \
            .github/patches/dashboard-freshness-corrections_v2.part04 \
            .github/patches/dashboard-freshness-corrections_v2.part05 \
            > /tmp/dashboard-freshness-corrections_v2.patch
          echo "dba116c7366d882ee989220b296b2196b204884297ad5afcd3ef5cdfac44a6ed  /tmp/dashboard-freshness-corrections_v2.patch" | sha256sum -c -
          git merge-base --is-ancestor ed968c9b03a64eef8dc886925b148aae2db22bcb HEAD

      - name: Apply exact reviewed patch
        run: |
          set -euo pipefail
          git config user.name "Opr1130"
          git config user.email "40672499+Opr1130@users.noreply.github.com"
          git am /tmp/dashboard-freshness-corrections_v2.patch

      - name: Install test dependencies
        working-directory: OHM-Trade-Agent-v1
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate patch
        working-directory: OHM-Trade-Agent-v1
        run: |
          set -euo pipefail
          python -m pytest -q
          python -m compileall -q app tests
          git diff --check ed968c9b03a64eef8dc886925b148aae2db22bcb..HEAD
          bash -n deploy/analytics/opip-data-platform-maintenance.sh
          command -v shellcheck >/dev/null 2>&1 || {
            sudo apt-get update
            sudo apt-get install -y shellcheck
          }
          shellcheck deploy/analytics/opip-data-platform-maintenance.sh
          test ! -e .env
          : > .env
          trap 'rm -f .env' EXIT
          docker compose config -q

      - name: Remove temporary applicator and push validated patch
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/apply-dashboard-freshness-patch-temp.yml \
            .github/patches/dashboard-freshness-corrections_v2.part00 \
            .github/patches/dashboard-freshness-corrections_v2.part01 \
            .github/patches/dashboard-freshness-corrections_v2.part02 \
            .github/patches/dashboard-freshness-corrections_v2.part03 \
            .github/patches/dashboard-freshness-corrections_v2.part04 \
            .github/patches/dashboard-freshness-corrections_v2.part05
          git commit -m "Remove temporary dashboard freshness patch applicator"
          git push origin HEAD:copilot/dashboard-freshness-corrections
