name: opip-sequence2-branch-ci

on:
  push:
    branches:
      - 'feature/opip-event-intelligence-foundation-v1'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OHM-Trade-Agent-v1
    env:
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: OHM-Trade-Agent-v1/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests/test_opip_event_intelligence_foundation_v1.py tests/test_opip_event_intelligence_safety_v1.py tests/test_asset_display_identity_v1.py tests/test_external_market_news_context.py tests/test_scheduled_catalysts.py
      - run: python -m pytest -q
      - run: python -m compileall -q app
