name: committee-shadow-activation

# O'Pip Intelligence Committee — OFF -> credentialled SHADOW control plane (IC-043).
#
# This is the separately authorised activation boundary the OFF installation
# deliberately stops short of. It is a distinct workflow from `deploy-committee.yml`
# on purpose: the install workflow must keep proving that it never activates
# credentialled SHADOW calls, and a single file cannot honestly assert both.
#
# It performs four owner-gated operations, selected by the command in the issue
# comment. Every one of them is maintainer-visible in the receipt:
#
#   /shadow-committee <40-char-sha> <not-before-iso8601> <review-by-iso8601>
#         Activate: prove both dedicated provider credentials exist, pin provider-only
#         egress, set mode shadow with an explicit UTC activation boundary and a
#         registry review date, cap a cycle at one case, and leave the timer disabled.
#   /committee-canary <40-char-sha>
#         Run exactly one bounded cycle with the recurring timer still disabled.
#   /committee-timer <40-char-sha>
#         Enable the existing bounded recurring timer, keeping the one-case cap.
#   /rollback-committee
#         Return the plane to OFF with deny-all egress. Advisory evidence survives.
#
# It never carries a provider credential value: the activation script reads the
# host's own protected environment file and reports only presence verdicts. It
# never touches a Kraken or Telegram credential, and it grants no trading authority.

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: opip-committee
  cancel-in-progress: false

jobs:
  control:
    if: >-
      github.event.issue.number == 64 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      (startsWith(github.event.comment.body, '/shadow-committee ') ||
       startsWith(github.event.comment.body, '/committee-canary ') ||
       startsWith(github.event.comment.body, '/committee-timer ') ||
       startsWith(github.event.comment.body, '/rollback-committee'))
    runs-on: ubuntu-latest
    environment: committee-shadow
    steps:
      - name: Resolve owner command
        id: command
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          BODY="$COMMENT_BODY"
          SHA_RE='^[0-9a-f]{40}$'
          # ISO-8601 instant, either a `Z` or a numeric UTC offset. Validated here,
          # before the value is ever interpolated into a remote `sudo bash` command
          # line, and re-validated on the host.
          ISO_RE='^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(Z|[+-][0-9]{2}:[0-9]{2})$'
          if [[ "$BODY" =~ ^/shadow-committee[[:space:]]+(.+)$ ]]; then
            # Split on whitespace rather than matching nested groups: a nested
            # group shifts every later BASH_REMATCH index, which silently
            # mis-assigned the second instant.
            read -r -a PARTS <<< "${BASH_REMATCH[1]}"
            if [[ "${#PARTS[@]}" -ne 3 ]]; then
              echo "Refusing committee activation: /shadow-committee needs a SHA, a not-before instant, and a review-by instant." >&2
              exit 64
            fi
            if [[ ! "${PARTS[0]}" =~ $SHA_RE ]]; then
              echo "Refusing committee activation: the first argument must be a 40-character lowercase SHA." >&2
              exit 64
            fi
            if [[ ! "${PARTS[1]}" =~ $ISO_RE ]]; then
              echo "Refusing committee activation: not-before must be an ISO-8601 UTC instant." >&2
              exit 64
            fi
            if [[ ! "${PARTS[2]}" =~ $ISO_RE ]]; then
              echo "Refusing committee activation: review-by must be an ISO-8601 UTC instant." >&2
              exit 64
            fi
            echo "command=shadow" >> "$GITHUB_OUTPUT"
            echo "sha=${PARTS[0]}" >> "$GITHUB_OUTPUT"
            echo "not_before=${PARTS[1]}" >> "$GITHUB_OUTPUT"
            echo "review_by=${PARTS[2]}" >> "$GITHUB_OUTPUT"
          elif [[ "$BODY" =~ ^/committee-canary[[:space:]]+([0-9a-f]{40})[[:space:]]*$ ]]; then
            echo "command=canary" >> "$GITHUB_OUTPUT"
            echo "sha=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          elif [[ "$BODY" =~ ^/committee-timer[[:space:]]+([0-9a-f]{40})[[:space:]]*$ ]]; then
            echo "command=timer" >> "$GITHUB_OUTPUT"
            echo "sha=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          elif [[ "$BODY" =~ ^/rollback-committee([[:space:]]+([0-9a-f]{40}))?[[:space:]]*$ ]]; then
            echo "command=rollback" >> "$GITHUB_OUTPUT"
            # An optional SHA selects the release tree as the rollback vehicle, so
            # the safety action does not depend on the durable helper being present.
            echo "sha=${BASH_REMATCH[2]:-}" >> "$GITHUB_OUTPUT"
          else
            echo "Refusing committee activation: unrecognised command." >&2
            echo "Formats: /shadow-committee <40-char-sha> <not-before-iso8601> <review-by-iso8601>, /committee-canary <40-char-sha>, /committee-timer <40-char-sha>, /rollback-committee [40-char-sha]" >&2
            exit 64
          fi

      - name: Require target to equal current main
        if: steps.command.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.command.outputs.sha }}
        run: |
          set -euo pipefail
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          test "$TARGET_SHA" = "$MAIN_SHA" || {
            echo "Refusing committee activation: target is not current main." >&2
            exit 65
          }

      - name: Require successful exact-SHA CI
        if: steps.command.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.command.outputs.sha }}
        run: |
          set -euo pipefail
          RESULT="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow pytest.yml \
            --branch main \
            --commit "$TARGET_SHA" \
            --limit 1 \
            --json status,conclusion \
            --jq '.[0] | [.status,.conclusion] | @tsv')"
          test "$RESULT" = $'completed\tsuccess' || {
            echo "Refusing committee activation: pytest.yml is not successful for the exact SHA." >&2
            exit 1
          }

      - name: Check out exact approved release
        if: steps.command.outputs.sha != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.command.outputs.sha }}
          persist-credentials: false

      - name: Validate committee host connection secrets
        env:
          HOST: ${{ secrets.OPIP_LEARNING_HOST }}
          USER: ${{ secrets.OPIP_LEARNING_USER }}
          SSH_KEY_B64: ${{ secrets.OPIP_LEARNING_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.OPIP_LEARNING_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$HOST"
          test -n "$USER"
          test -n "$SSH_KEY_B64"
          test -n "$KNOWN_HOSTS"

      - name: Configure pinned SSH identity
        env:
          SSH_KEY_B64: ${{ secrets.OPIP_LEARNING_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.OPIP_LEARNING_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$SSH_KEY_B64" | base64 --decode > ~/.ssh/opip_committee
          chmod 600 ~/.ssh/opip_committee
          ssh-keygen -y -f ~/.ssh/opip_committee >/dev/null
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload exact release tree
        if: steps.command.outputs.sha != ''
        env:
          HOST: ${{ secrets.OPIP_LEARNING_HOST }}
          USER: ${{ secrets.OPIP_LEARNING_USER }}
          PORT: ${{ secrets.OPIP_LEARNING_PORT }}
          TARGET_SHA: ${{ steps.command.outputs.sha }}
        run: |
          set -euo pipefail
          PORT="${PORT:-22}"
          SSH=(ssh -i ~/.ssh/opip_committee -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -p "$PORT")
          REMOTE="$USER@$HOST"
          RELEASE_DIR="/var/tmp/opip-committee-$TARGET_SHA-$GITHUB_RUN_ID"
          "${SSH[@]}" "$REMOTE" "sudo -n install -d -o root -g root -m 0700 '$RELEASE_DIR'"
          git archive --format=tar "$TARGET_SHA" | "${SSH[@]}" "$REMOTE" "sudo -n tar -xf - -C '$RELEASE_DIR'"

      # -------------------------------------------------- pre-operation proof
      # No state-changing Committee operation may run on an unproven plane, and a
      # controller-side check is not enforcement. The proof runs from the exact
      # uploaded release tree, which is pinned to TARGET_SHA and carries the
      # canonicalizer the helper resolves as a sibling.
      - name: Prove SHADOW before the requested operation
        id: pre_operation_shadow
        if: >-
          steps.command.outputs.command == 'canary' ||
          steps.command.outputs.command == 'timer'
        continue-on-error: true
        env:
          HOST: ${{ secrets.OPIP_LEARNING_HOST }}
          USER: ${{ secrets.OPIP_LEARNING_USER }}
          PORT: ${{ secrets.OPIP_LEARNING_PORT }}
          # Declared explicitly: the proof below binds this exact SHA, and an
          # undeclared variable would expand to empty and be refused as a usage
          # error, permanently blocking the canary and timer commands.
          TARGET_SHA: ${{ steps.command.outputs.sha }}
        run: |
          set +e
          set -u
          PORT="${PORT:-22}"
          RELEASE_DIR="/var/tmp/opip-committee-${{ steps.command.outputs.sha }}-$GITHUB_RUN_ID"
          ssh \
            -i ~/.ssh/opip_committee \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "$PORT" \
            "$USER@$HOST" \
            "sudo -n bash '$RELEASE_DIR/OHM-Trade-Agent-v1/deploy/committee/verify-committee-shadow.sh' --expected-sha '$TARGET_SHA'" \
            2>&1 | tee committee-pre-operation-proof.log
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [[ "$rc" -eq 0 ]] && grep -q '^SHADOW_PROOF=PASS$' committee-pre-operation-proof.log; then
            echo "pre_operation_shadow=PROVEN"
            echo "result=PROVEN" >> "$GITHUB_OUTPUT"
          else
            echo "pre_operation_shadow=FAILED"
            echo "result=FAILED" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      # ------------------------------------------------------------ activate
      - name: Activate credentialled SHADOW (timer stays disabled)
        id: activate
        if: steps.command.outputs.command == 'shadow'
        continue-on-error: true
        env:
          HOST: ${{ secrets.OPIP_LEARNING_HOST }}
          USER: ${{ secrets.OPIP_LEARNING_USER }}
          PORT: ${{ secrets.OPIP_LEARNING_PORT }}
          TARGET_SHA: ${{ steps.command.outputs.sha }}
          NOT_BEFORE: ${{ steps.command.outputs.not_before }}
          REVIEW_BY: ${{ steps.command.outputs.review_by }}
        run: |
          set +e
          set -u
          PORT="${PORT:-22}"
          RELEASE_DIR="/var/tmp/opip-committee-$TARGET_SHA-$GITHUB_RUN_ID"
          ssh \
            -i ~/.ssh/opip_committee \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -p "$PORT" \
            "$USER@$HOST" \
            "sudo -n bash '$RELEASE_DIR/OHM-Trade-Agent-v1/deploy/committee/activate-committee-shadow.sh' '$TARGET_SHA' '$NOT_BEFORE' '$REVIEW_BY'" \
            2>&1 | tee committee-activate.log
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "bundle=NOT_ATTEMPTED" >> "$GITHUB_OUTPUT"
          echo "stable_proof=NOT_ATTEMPTED" >> "$GITHUB_OUTPUT"
          echo "safe_off=NOT_ATTEMPTED" >> "$GITHUB_OUTPUT"

          if grep -q '^SHADOW_ACTIVATION=BLOCKED' committee-activate.log; then
            echo "result=BLOCKED" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$rc" -ne 0 ]] || ! grep -q '^SHADOW_ACTIVATION=PASS' committee-activate.log; then
            echo "result=FAILED" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RELEASE_COMMITTEE="$RELEASE_DIR/OHM-Trade-Agent-v1/deploy/committee"
          STABLE_PROOF="/usr/local/sbin/opip-committee-shadow-proof"
          STABLE_POLICY="/usr/local/sbin/ip_allow_policy.py"

          remote() {
            ssh \
              -i ~/.ssh/opip_committee \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=20 \
              -p "$PORT" \
              "$USER@$HOST" "$@"
          }

          # A proven SHADOW plane must never be left active without a usable durable
          # proof artifact: the activation contract is "activate AND prove". The
          # rollback vehicle is the release tree, which is pinned to the authorized
          # SHA and carries both reviewed files, so SAFE-OFF is provable even when
          # the durable bundle is what failed.
          stable_safe_off() {
            remote "sudo -n bash '$RELEASE_COMMITTEE/verify-committee-shadow.sh' --rollback" \
              2>&1 | tee committee-stable-safeoff.log
            local safe_rc=${PIPESTATUS[0]}
            if [[ "$safe_rc" -eq 0 ]] && grep -q '^ROLLBACK_PROOF=PASS$' committee-stable-safeoff.log; then
              echo "SAFE_OFF=PROVEN"
              echo "safe_off=PROVEN" >> "$GITHUB_OUTPUT"
              return 0
            fi
            echo "SAFE_OFF=FAIL the plane could not be returned to a proven OFF state" >&2
            echo "safe_off=FAIL" >> "$GITHUB_OUTPUT"
            return 1
          }

          # The stable proof artifact is a BUNDLE, not a script. The helper resolves
          # its canonicalizer as a sibling, so installing only the script leaves the
          # durable proof permanently unable to run its allowlist comparison. Both
          # reviewed files from the exact authorized release SHA are installed, and
          # the installation is fail-closed: this step's `set +e` must never let a
          # failed install reach result=ACTIVATED.
          remote "sudo -n install -m 0755 -o root -g root '$RELEASE_COMMITTEE/verify-committee-shadow.sh' '$STABLE_PROOF' && sudo -n install -m 0644 -o root -g root '$RELEASE_COMMITTEE/ip_allow_policy.py' '$STABLE_POLICY'" \
            2>&1 | tee committee-stable-install.log
          install_rc=${PIPESTATUS[0]}
          bundle_state="$(remote "sudo -n sh -c 'if [ -x \"$STABLE_PROOF\" ] && [ -f \"$STABLE_POLICY\" ]; then echo READY; else echo INCOMPLETE; fi'" 2>/dev/null | tr -d '\r' | tail -n1)"
          if [[ "$install_rc" -ne 0 || "$bundle_state" != "READY" ]]; then
            echo "STABLE_BUNDLE=FAILED install_rc=${install_rc} observed=${bundle_state:-none}"
            echo "bundle=FAILED" >> "$GITHUB_OUTPUT"
            stable_safe_off || true
            echo "result=FAILED" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "STABLE_BUNDLE=READY both reviewed proof artifacts installed"
          echo "bundle=READY" >> "$GITHUB_OUTPUT"

          # The durable proof must work, not merely exist. The installed helper
          # proves the plane itself, from the stable path an operator will use.
          # Bound to the requested TARGET_SHA: a worker activated at any other
          # SHA classifies RELEASE_DRIFT and this step fails, so the canary (or
          # the timer) is unreachable.
          remote "sudo -n bash '$STABLE_PROOF' --expected-sha '$TARGET_SHA'" \
            2>&1 | tee committee-stable-proof.log
          stable_rc=${PIPESTATUS[0]}
          if [[ "$stable_rc" -eq 0 ]] && grep -q '^SHADOW_PROOF=PASS$' committee-stable-proof.log; then
            echo "STABLE_PROOF=PROVEN"
            echo "stable_proof=PROVEN" >> "$GITHUB_OUTPUT"
            echo "result=ACTIVATED" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "STABLE_PROOF=FAILED the installed stable helper could not prove the plane"
          echo "stable_proof=FAILED" >> "$GITHUB_OUTPUT"
          stable_safe_off || true
          echo "result=FAILED" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Prove SHADOW mode
        id: shadow_proof
        if: steps.command.outputs.command == 'shadow'
        continue-on-error: true
        env:
          HOST: ${{ secrets.OPIP_LEARNING_HOST }}
          USER: ${{ secrets.OPIP_LEARNING_USER }}
          PORT: ${{ secrets.OPIP_LEARNING_PORT }}
          TARGET_SHA: ${{ steps.command.outputs.sha }}
        run: |
          set +e
          set -u
          PORT="${PORT:-22}"
          RELEASE_DIR="/var/tmp/opip-committee-${{ steps.command.outputs.sha }}-$GITHUB_RUN_ID"
          ssh \
            -i ~/.ssh/opip_committee \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "$PORT" \
            "$USER@$HOST" \
            "sudo -n bash '$RELEASE_DIR/OHM-Trade-Agent-v1/deploy/committee/verify-committee-shadow.sh' --expected-sha '$TARGET_SHA'" \
            2>&1 | tee committee-shadow-proof.log
          RC=${PIPESTATUS[0]}
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          if [[ "$RC" -eq 0 ]] && grep -q '^SHADOW_PROOF=PASS$' committee-shadow-proof.log; then
            echo "result=PROVEN" >> "$GITHUB_OUTPUT"
          else
            echo "result=FAILED" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      # -------------------------------------------------------------- canary
      - name: Run one bounded credentialled canary cycle (timer disabled)
        id: canary
        if: >-
          steps.command.outputs.command == 'canary' &&
          steps.pre_operation_shadow.outputs.result == 'PROVEN'
        continue-on-error: true
        env:
          HOST: ${{ secrets.OPIP_LEARNING_HOST }}
          USER: ${{ secrets.OPIP_LEARNING_USER }}
          PORT: ${{ secrets.OPIP_LEARNING_PORT }}
          TARGET_SHA: ${{ steps.command.outputs.sha }}
        run: |
          set +e
          set -u
          PORT="${PORT:-22}"
          ssh \
            -i ~/.ssh/opip_committee \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -p "$PORT" \
            "$USER@$HOST" \
            "sudo -n systemctl start opip-committee-shadow.service" \
            2>&1 | tee committee-canary.log
          RC=${PIPESTATUS[0]}
          ssh \
            -i ~/.ssh/opip_committee \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "$PORT" \
            "$USER@$HOST" \
            "sudo -n journalctl -u opip-committee-shadow.service -n 40 --no-pager" \
            2>&1 | tee -a committee-canary.log
          # Report the durable advisory counts. Only counts and dispositions are
          # printed: no model output, no environment, no credential.
          ssh \
            -i ~/.ssh/opip_committee \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "$PORT" \
            "$USER@$HOST" \
            "sudo -n sh -c 'd=/var/lib/opip-committee; for f in role_results.jsonl role_case_outcomes.jsonl cycle_dispositions.jsonl daily_spend.json; do if [ -f \"\$d/\$f\" ]; then printf \"%s lines=%s\\n\" \"\$f\" \"\$(wc -l < \"\$d/\$f\")\"; else printf \"%s ABSENT\\n\" \"\$f\"; fi; done'" \
            2>&1 | tee -a committee-canary.log
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          if [[ "$RC" -eq 0 ]]; then
            echo "result=RAN" >> "$GITHUB_OUTPUT"
          else
            echo "result=FAILED" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      # --------------------------------------------------------------- timer
      - name: Enable the bounded recurring timer
        id: timer
        if: >-
          steps.command.outputs.command == 'timer' &&
          steps.pre_operation_shadow.outputs.result == 'PROVEN'
        continue-on-error: true
        env:
          HOST: ${{ secrets.OPIP_LEARNING_HOST }}
          USER: ${{ secrets.OPIP_LEARNING_USER }}
          PORT: ${{ secrets.OPIP_LEARNING_PORT }}
          TARGET_SHA: ${{ steps.command.outputs.sha }}
        run: |
          set +e
          set -u
          PORT="${PORT:-22}"
          ssh \
            -i ~/.ssh/opip_committee \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "$PORT" \
            "$USER@$HOST" \
            "sudo -n systemctl enable --now opip-committee-shadow.timer" \
            2>&1 | tee committee-timer.log
          RC=${PIPESTATUS[0]}
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          if [[ "$RC" -eq 0 ]]; then
            echo "result=ENABLED" >> "$GITHUB_OUTPUT"
          else
            echo "result=FAILED" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      # ------------------------------------------------------------ rollback
      - name: Return the plane to OFF and prove it
        id: rollback
        if: steps.command.outputs.command == 'rollback'
        continue-on-error: true
        env:
          HOST: ${{ secrets.OPIP_LEARNING_HOST }}
          USER: ${{ secrets.OPIP_LEARNING_USER }}
          PORT: ${{ secrets.OPIP_LEARNING_PORT }}
          TARGET_SHA: ${{ steps.command.outputs.sha }}
        run: |
          set +e
          set -u
          PORT="${PORT:-22}"
          # Two vehicles, so the safety action never depends on a single artifact.
          # With a SHA, the pinned release tree is used, which is available even
          # when the durable helper is missing or broken; without one, the durable
          # helper. Either way the plane is returned to a proven OFF state.
          if [[ -n "${TARGET_SHA:-}" ]]; then
            ROLLBACK_VEHICLE="/var/tmp/opip-committee-$TARGET_SHA-$GITHUB_RUN_ID/OHM-Trade-Agent-v1/deploy/committee/verify-committee-shadow.sh"
          else
            ROLLBACK_VEHICLE="/usr/local/sbin/opip-committee-shadow-proof"
          fi
          ssh \
            -i ~/.ssh/opip_committee \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "$PORT" \
            "$USER@$HOST" \
            "sudo -n bash '$ROLLBACK_VEHICLE' --rollback" \
            2>&1 | tee committee-rollback.log
          RC=${PIPESTATUS[0]}
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          if [[ "$RC" -eq 0 ]] && grep -q '^ROLLBACK_PROOF=PASS$' committee-rollback.log; then
            echo "result=ROLLED_BACK" >> "$GITHUB_OUTPUT"
          else
            echo "result=FAILED" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Clean remote release
        id: committee_cleanup
        if: always() && steps.command.outputs.sha != ''
        env:
          HOST: ${{ secrets.OPIP_LEARNING_HOST }}
          USER: ${{ secrets.OPIP_LEARNING_USER }}
          PORT: ${{ secrets.OPIP_LEARNING_PORT }}
          TARGET_SHA: ${{ steps.command.outputs.sha }}
        run: |
          set +e
          set -u
          PORT="${PORT:-22}"
          RELEASE_DIR="/var/tmp/opip-committee-$TARGET_SHA-$GITHUB_RUN_ID"
          ssh \
            -i ~/.ssh/opip_committee \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "$PORT" \
            "$USER@$HOST" \
            "sudo -n rm -rf -- '$RELEASE_DIR'"
          RC=$?
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          if [[ "$RC" -eq 0 ]]; then
            echo "result=CLEANED" >> "$GITHUB_OUTPUT"
          else
            echo "result=FAILED" >> "$GITHUB_OUTPUT"
          fi
          exit "$RC"

      - name: Publish committee activation receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          COMMAND: ${{ steps.command.outputs.command }}
          TARGET_SHA: ${{ steps.command.outputs.sha }}
          PRE_OPERATION_SHADOW: ${{ steps.pre_operation_shadow.outputs.result }}
          STABLE_BUNDLE: ${{ steps.activate.outputs.bundle }}
          STABLE_PROOF: ${{ steps.activate.outputs.stable_proof }}
          SAFE_OFF: ${{ steps.activate.outputs.safe_off }}
          RESULTS: >-
            activate=${{ steps.activate.outputs.result }} shadow=${{ steps.shadow_proof.outputs.result }}
            canary=${{ steps.canary.outputs.result }} timer=${{ steps.timer.outputs.result }}
            rollback=${{ steps.rollback.outputs.result }}
          CLEANUP_RESULT: ${{ steps.committee_cleanup.outputs.result }}
          CLEANUP_RC: ${{ steps.committee_cleanup.outputs.rc }}
        run: |
          set -euo pipefail
          RUN_URL="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          PROOF="$(
            grep -hE '^(PASS|FAIL|INFO|ROLLBACK_APPLIED=|ROLLBACK_PROOF=|SHADOW_ACTIVATION=|SHADOW_PROOF=|STABLE_BUNDLE=|STABLE_PROOF=|SAFE_OFF=|pre_operation_shadow=|release_compatibility_status=)' \
              committee-pre-operation-proof.log committee-activate.log \
              committee-stable-install.log committee-stable-proof.log \
              committee-stable-safeoff.log committee-shadow-proof.log \
              committee-canary.log committee-timer.log committee-rollback.log 2>/dev/null || true
          )"
          BODY=$(cat <<EOF
          ## O'Pip Intelligence Committee Activation Receipt

          - **Command:** \`$COMMAND\`
          - **SHA:** \`$TARGET_SHA\`
          - **Stage results:** ${RESULTS//$'\n'/ }
          - **Pre-operation SHADOW proof:** ${PRE_OPERATION_SHADOW:-NOT RUN}
          - **Stable proof bundle:** ${STABLE_BUNDLE:-NOT ATTEMPTED} / ${STABLE_PROOF:-NOT ATTEMPTED} (safe-off: ${SAFE_OFF:-NOT ATTEMPTED})
          - **Remote cleanup:** ${CLEANUP_RESULT:-NOT RUN} (rc=${CLEANUP_RC:-N/A})
          - **Workflow run:** $RUN_URL

          \`\`\`
          $PROOF
          \`\`\`

          This workflow is the separately authorised OFF -> credentialled SHADOW boundary.
          It reports presence verdicts and proof lines only: it never prints an
          environment file, a credential name, a credential value, or model output.
          The Committee remains a measurement plane. It grants no order, sizing,
          protection, exchange, Telegram, or funded/live trading authority, and it never
          touches a Kraken or Telegram credential.
          EOF
          )
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/64/comments" -f body="$BODY" >/dev/null

      - name: Fail unless the requested operation succeeded
        if: always()
        env:
          COMMAND: ${{ steps.command.outputs.command }}
          ACTIVATE_RESULT: ${{ steps.activate.outputs.result }}
          STABLE_BUNDLE: ${{ steps.activate.outputs.bundle }}
          STABLE_PROOF: ${{ steps.activate.outputs.stable_proof }}
          SAFE_OFF: ${{ steps.activate.outputs.safe_off }}
          SHADOW_RESULT: ${{ steps.shadow_proof.outputs.result }}
          PRE_OPERATION_SHADOW: ${{ steps.pre_operation_shadow.outputs.result }}
          CANARY_RESULT: ${{ steps.canary.outputs.result }}
          TIMER_RESULT: ${{ steps.timer.outputs.result }}
          ROLLBACK_RESULT: ${{ steps.rollback.outputs.result }}
          CLEANUP_RESULT: ${{ steps.committee_cleanup.outputs.result }}
        run: |
          set -euo pipefail
          case "$COMMAND" in
            shadow)
              if [[ "$ACTIVATE_RESULT" = "BLOCKED" ]]; then
                echo "SHADOW activation is BLOCKED by unmet preconditions; nothing was changed." >&2
                exit 1
              fi
              test "$ACTIVATE_RESULT" = "ACTIVATED" || { echo "SHADOW activation did not succeed." >&2; exit 1; }
              # A durable proof artifact that cannot be installed or cannot prove the
              # plane is a failed activation, never a successful one.
              test "$STABLE_BUNDLE" = "READY" || { echo "The stable proof bundle was not installed." >&2; exit 1; }
              test "$STABLE_PROOF" = "PROVEN" || { echo "The installed stable proof helper could not prove the plane." >&2; exit 1; }
              test "$SHADOW_RESULT" = "PROVEN" || { echo "SHADOW mode was not proven." >&2; exit 1; }
              ;;
            canary)
              test "$PRE_OPERATION_SHADOW" = "PROVEN" || { echo "Pre-canary SHADOW proof failed; the canary was not started." >&2; exit 1; }
              test "$CANARY_RESULT" = "RAN" || { echo "Canary cycle did not run." >&2; exit 1; }
              ;;
            timer)
              test "$PRE_OPERATION_SHADOW" = "PROVEN" || { echo "Pre-timer SHADOW proof failed; the timer was not enabled." >&2; exit 1; }
              test "$TIMER_RESULT" = "ENABLED" || { echo "The recurring timer was not enabled." >&2; exit 1; }
              ;;
            rollback)
              test "$ROLLBACK_RESULT" = "ROLLED_BACK" || { echo "Rollback was not proven." >&2; exit 1; }
              ;;
            *)
              echo "Unrecognised command '$COMMAND'." >&2
              exit 1
              ;;
          esac
          if [[ "$COMMAND" != "rollback" ]]; then
            test "$CLEANUP_RESULT" = "CLEANED" || { echo "The temporary remote release directory was not removed." >&2; exit 1; }
          fi
