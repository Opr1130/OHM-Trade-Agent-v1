name: pytest

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OHM-Trade-Agent-v1
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: opip_test
          POSTGRES_PASSWORD: test_password_min_20_chars_long
          POSTGRES_DB: opip_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      APP_ENV: test
      OPIP_TEST_DATABASE_URL: postgresql://opip_test:test_password_min_20_chars_long@localhost:5432/opip_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: OHM-Trade-Agent-v1/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m compileall -q app
      - name: Validate production Compose
        run: |
          test ! -e .env
          : > .env
          trap 'rm -f .env' EXIT
          docker compose config -q
      - name: Validate deployment shell
        run: |
          bash -n deploy/remote/ohm-deploy
          bash -n deploy/remote/ohm-deploy-ssh
          bash -n deploy/remote/reconcile-scheduler.sh
          bash -n deploy/remote/reconcile-stream-worker.sh
