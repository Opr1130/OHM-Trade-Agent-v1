name: pytest

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OHM-Trade-Agent-v1
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: opip_test
          POSTGRES_PASSWORD: test_password_min_20_chars_long
          POSTGRES_DB: opip_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      APP_ENV: test
      OPIP_TEST_DATABASE_URL: postgresql://opip_test:test_password_min_20_chars_long@localhost:5432/opip_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: OHM-Trade-Agent-v1/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m compileall -q app
      - name: Validate production Compose
        run: |
          test ! -e .env
          : > .env
          trap 'rm -f .env' EXIT
          docker compose config -q
      - name: Validate deployment shell
        run: |
          bash -n deploy/remote/ohm-deploy
          bash -n deploy/remote/ohm-deploy-ssh
          bash -n deploy/remote/reconcile-scheduler.sh
          bash -n deploy/remote/reconcile-stream-worker.sh
          bash -n deploy/remote/export-opip-learning-evidence.sh
          bash -n deploy/remote/opip-learning-read-export.sh
          bash -n deploy/learning/opip-learning-sync.sh
          bash -n deploy/learning/opip-learning-job.sh
      # The canonical learning-replica transfer E2E executes the real exporter,
      # forced reader and sync, and the exporter is intentionally root-only. The
      # ordinary pytest run above collects it but skips it (not root), so it is
      # executed here exactly once, with root, against a real learning image.
      - name: Build learning image for replica E2E
        run: docker build -t "opip-learning:ci-${{ github.sha }}" .
      - name: Canonical learning-replica transfer E2E (root)
        env:
          OPIP_LEARNING_TEST_IMAGE: opip-learning:ci-${{ github.sha }}
        run: |
          sudo -E "$(which python)" -m pytest -q \
            tests/test_canonical_learning_replica_transfer_e2e_v1.py -rs
