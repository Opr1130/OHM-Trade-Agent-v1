name: pytest

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OHM-Trade-Agent-v1
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: opip_test
          POSTGRES_PASSWORD: test_password_min_20_chars_long
          POSTGRES_DB: opip_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      APP_ENV: test
      OPIP_TEST_DATABASE_URL: postgresql://opip_test:test_password_min_20_chars_long@localhost:5432/opip_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: OHM-Trade-Agent-v1/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m compileall -q app
      - name: Validate production Compose
        run: |
          test ! -e .env
          cat > .env <<'EOF'
          OPIP_RELEASE_PROFILE=SAFE_BASELINE
          OPIP_FEATURE_BUS_MODE=active
          OPIP_CANONICAL_WRITER_MODE=active
          OPIP_TARGET_SPINE_MODE=off
          OPIP_PAPER_V2_MODE=active
          OPIP_COMMITTEE_MODE=shadow
          EOF
          trap 'rm -f .env' EXIT
          docker compose config -q
          docker compose config --format json | python -c 'import json,sys; e=json.load(sys.stdin)["services"]["ohm-trade-agent"]["environment"]; expected={"OPIP_RELEASE_PROFILE":"EVIDENCE_SHADOW","OPIP_FEATURE_BUS_MODE":"shadow","OPIP_CANONICAL_WRITER_MODE":"shadow","OPIP_TARGET_SPINE_MODE":"shadow","OPIP_PAPER_V2_MODE":"off","OPIP_COMMITTEE_MODE":"off"}; assert all(e.get(k)==v for k,v in expected.items()), e'
      - name: Validate deployment shell
        run: |
          bash -n deploy/remote/ohm-deploy
          bash -n deploy/remote/ohm-deploy-ssh
          bash -n deploy/remote/reconcile-scheduler.sh
          bash -n deploy/remote/reconcile-stream-worker.sh
          bash -n deploy/remote/export-opip-learning-evidence.sh
          bash -n deploy/remote/opip-learning-read-export.sh
          bash -n deploy/remote/diagnose-opip-learning.sh
          bash -n deploy/learning/opip-learning-sync.sh
          bash -n deploy/learning/opip-learning-job.sh
          bash -n deploy/analytics/bootstrap-opip-data-platform.sh
          bash -n deploy/analytics/run-gated-stage.sh
          bash -n deploy/analytics/opip-data-platform-maintenance.sh
          bash -n deploy/analytics/opip-postgres-backup.sh
          bash -n deploy/analytics/opip-postgres-restore-drill.sh
      # The canonical learning-replica transfer E2E executes the real exporter,
      # forced reader and sync, and the exporter is intentionally root-only. The
      # ordinary pytest run above collects it but skips it (not root), so it is
      # executed here exactly once, with root, against a real learning image.
      - name: Build learning image for replica E2E
        run: docker build -t "opip-learning:ci-${{ github.sha }}" .
      - name: Canonical learning-replica transfer E2E (root)
        env:
          OPIP_LEARNING_TEST_IMAGE: opip-learning:ci-${{ github.sha }}
        run: |
          sudo -E "$(which python)" -m pytest -q \
            tests/test_canonical_learning_replica_transfer_e2e_v1.py -rs

  atdd-scope:
    name: atdd scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce the active ATDD increment against the changed-file set
        working-directory: OHM-Trade-Agent-v1
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}"
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          case "$base" in
            ""|0000000000000000000000000000000000000000)
              echo "changed-file base is missing" >&2
              exit 2
              ;;
          esac
          git rev-parse --verify "$base"
          increment="$(tr -d '\r\n' < docs/atdd/ACTIVE_INCREMENT)"
          python tests/atdd_scope.py --increment "$increment" --git-base "$base"

  architecture-gate:
    name: release architecture gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OHM-Trade-Agent-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install architecture evaluator dependency
        run: python -m pip install PyYAML
      - name: Evaluate the SHA-pinned release profile
        run: |
          set -euo pipefail
          python -m app.services.release_profiles --profile EVIDENCE_SHADOW \
            | tee release-architecture-gate.txt
          grep -Fx 'ARCHITECTURE_GATE=PASS' release-architecture-gate.txt
          grep -Fx 'PROFILE=EVIDENCE_SHADOW' release-architecture-gate.txt
          grep -Fx 'FEATURE_BUS=shadow' release-architecture-gate.txt
          grep -Fx 'CANONICAL_WRITER=shadow' release-architecture-gate.txt
          grep -Fx 'TARGET_SPINE=shadow' release-architecture-gate.txt
          grep -Fx 'NEW_ENTRY_AUTHORITY=LEGACY_ONLY' release-architecture-gate.txt
          grep -Fx 'FUNDED_AUTHORITY=ABSENT' release-architecture-gate.txt
          grep -Fx 'PAPER_V2=OFF' release-architecture-gate.txt
          grep -Fx 'COMMITTEE_MODE=off' release-architecture-gate.txt
          grep -Fx 'PROTECTION=INDEPENDENT' release-architecture-gate.txt
      - name: Retain architecture-gate receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-architecture-gate-${{ github.sha }}
          path: OHM-Trade-Agent-v1/release-architecture-gate.txt
          if-no-files-found: ignore
          retention-days: 30

  security-gate:
    name: release security gate (Bandit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OHM-Trade-Agent-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Bandit
        run: python -m pip install bandit==1.9.4
      - name: Fail closed on release gate and runtime verifier findings
        run: bandit app/services/release_profiles.py app/services/release_runtime_verifier.py -c pyproject.toml

  release-candidate:
    name: non-deploying main release candidate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, atdd-scope, architecture-gate, security-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Publish exact-SHA candidate receipt
        env:
          SHA: ${{ github.sha }}
          TEST_RESULT: ${{ needs.test.result }}
          ATDD_RESULT: ${{ needs.atdd-scope.result }}
          ARCH_RESULT: ${{ needs.architecture-gate.result }}
          SECURITY_RESULT: ${{ needs.security-gate.result }}
        run: |
          set -euo pipefail
          test "$TEST_RESULT" = success
          test "$ATDD_RESULT" = success
          test "$ARCH_RESULT" = success
          test "$SECURITY_RESULT" = success
          {
            echo "SHA=$SHA"
            echo "PROFILE=EVIDENCE_SHADOW"
            echo "DEPLOY_RESULT=NOT_REQUESTED"
            echo "ARCHITECTURE_GATE=PASS"
            echo "PYTEST=PASS"
            echo "ATDD_SCOPE=PASS"
            echo "SECURITY=PASS"
            echo "PROTECTION=INDEPENDENT"
            echo "FEATURE_BUS=shadow"
            echo "CANONICAL_WRITER=shadow"
            echo "TARGET_SPINE=shadow"
            echo "PAPER_V2=off"
            echo "COMMITTEE_MODE=off"
            echo "NEW_ENTRY_AUTHORITY=LEGACY_ONLY"
            echo "FUNDED_AUTHORITY=ABSENT"
            echo "EVIDENCE_CAPTURE=NOT_DEPLOYED"
            echo "ROLLBACK=NOT_APPLICABLE"
            echo "RUNTIME_VERIFIED_AT=NOT_DEPLOYED"
            echo "RELEASE_CANDIDATE=READY"
          } | tee release-candidate.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Retain candidate receipt
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ github.sha }}
          path: release-candidate.txt
          retention-days: 30
