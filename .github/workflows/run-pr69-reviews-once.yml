name: Dispatch PR69 Multimodel Reviews Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/run-pr69-reviews-once.yml

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch Gemini and DeepSeek reviews for PR 69 and report status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          failed=0

          if gh workflow run gemini-review.yml --repo "$GITHUB_REPOSITORY" --ref main -f pr_number=69; then
            gemini="DISPATCHED"
          else
            gemini="FAILED"
            failed=1
          fi

          if gh workflow run deepseek-review.yml --repo "$GITHUB_REPOSITORY" --ref main -f pr_number=69; then
            deepseek="DISPATCHED"
          else
            deepseek="FAILED"
            failed=1
          fi

          marker="MULTIMODEL_REVIEW_DISPATCH_STATUS: Gemini=${gemini}; DeepSeek=${deepseek}; dispatcher_sha=${GITHUB_SHA}"
          gh pr comment 69 --repo "$GITHUB_REPOSITORY" --body "$marker"
          echo "$marker"

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
