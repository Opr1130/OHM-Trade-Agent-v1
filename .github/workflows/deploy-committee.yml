name: deploy-committee

# O'Pip Intelligence Committee — isolated shadow worker installation (IC-042).
#
# INSTALL AND VERIFY ONLY. This workflow does not activate credentialled SHADOW calls,
# does not enable provider execution, and does not merge anything. It installs the
# committed Committee worker artifacts at an exact approved main SHA with
# OPIP_COMMITTEE_MODE=off, leaves the timer disabled and inactive so no scheduled
# committee execution occurs, proves isolation, and proves the host runtime can
# import the committee cycle runner. It does not activate SHADOW.
#
# Egress while OFF is deny-all and fails closed: no provider allowlist is configured.
# Provider-specific egress belongs to the later activation boundary.
#
# The OFF -> credentialled SHADOW transition is a separate OWNER-authorised action with
# its own validation. Nothing here performs it.
#
# Governance mirrors deploy-learning.yml deliberately: same owner-gated trigger shape,
# same exact-main requirement, same exact-SHA CI requirement, same pinned SSH identity,
# same protected environment, same fail-closed receipt. It reuses the established
# learning-host connection because that is the approved host identity for this plane;
# it discovers no local workstation credential.

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: opip-committee
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.issue.number == 64 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/deploy-committee ')
    runs-on: ubuntu-latest
    # A protected environment specifically for Committee shadow installation, so the
    # host secrets are gated independently of the learning and analytics environments.
    environment: committee-shadow
    steps:
      - name: Resolve exact main SHA
        id: target
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          if [[ "$COMMENT_BODY" =~ ^/deploy-committee[[:space:]]+([0-9a-f]{40})[[:space:]]*$ ]]; then
            TARGET_SHA="${BASH_REMATCH[1]}"
          else
            echo "Refusing committee deployment: command format is /deploy-committee <40-char-sha>." >&2
            exit 64
          fi
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

      - name: Require target to equal current main
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          test "$TARGET_SHA" = "$MAIN_SHA" || {
            echo "Refusing committee deployment: target is not current main." >&2
            exit 65
          }

      - name: Require successful exact-SHA CI
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          RESULT="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow pytest.yml \
            --branch main \
            --commit "$TARGET_SHA" \
            --limit 1 \
            --json status,conclusion \
            --jq '.[0] | [.status,.conclusion] | @tsv')"
          test "$RESULT" = $'completed\tsuccess' || {
            echo "Refusing committee deployment: pytest.yml is not successful for the exact SHA." >&2
            exit 1
          }

      - name: Check out exact approved release
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false

      - name: Validate committee host connection secrets
        env:
          HOST: ${{ secrets.OPIP_LEARNING_HOST }}
          USER: ${{ secrets.OPIP_LEARNING_USER }}
          SSH_KEY_B64: ${{ secrets.OPIP_LEARNING_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.OPIP_LEARNING_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$HOST"
          test -n "$USER"
          test -n "$SSH_KEY_B64"
          test -n "$KNOWN_HOSTS"

      - name: Configure pinned SSH identity
        env:
          SSH_KEY_B64: ${{ secrets.OPIP_LEARNING_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.OPIP_LEARNING_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$SSH_KEY_B64" | base64 --decode > ~/.ssh/opip_committee
          chmod 600 ~/.ssh/opip_committee
          ssh-keygen -y -f ~/.ssh/opip_committee >/dev/null
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload exact release tree
        env:
          HOST: ${{ secrets.OPIP_LEARNING_HOST }}
          USER: ${{ secrets.OPIP_LEARNING_USER }}
          PORT: ${{ secrets.OPIP_LEARNING_PORT }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          PORT="${PORT:-22}"
          SSH=(ssh -i ~/.ssh/opip_committee -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -p "$PORT")
          REMOTE="$USER@$HOST"
          RELEASE_DIR="/var/tmp/opip-committee-$TARGET_SHA-$GITHUB_RUN_ID"
          "${SSH[@]}" "$REMOTE" "sudo -n install -d -o root -g root -m 0700 '$RELEASE_DIR'"
          git archive --format=tar "$TARGET_SHA" | "${SSH[@]}" "$REMOTE" "sudo -n tar -xf - -C '$RELEASE_DIR'"

      - name: Install the committee worker at the exact release SHA
        id: committee_install
        continue-on-error: true
        env:
          HOST: ${{ secrets.OPIP_LEARNING_HOST }}
          USER: ${{ secrets.OPIP_LEARNING_USER }}
          PORT: ${{ secrets.OPIP_LEARNING_PORT }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set +e
          PORT="${PORT:-22}"
          RELEASE_DIR="/var/tmp/opip-committee-$TARGET_SHA-$GITHUB_RUN_ID"
          # Only the committed artifact from the exact release tree is invoked. Mode is
          # forced to off by the bootstrap.
          #
          # --enable-timer is deliberately NOT passed. The initial deployment installs
          # the service and timer artifacts but leaves the timer disabled and inactive,
          # so there is no scheduled committee execution at all: zero provider calls and
          # zero committee cases. Timer activation belongs to the later, separately
          # OWNER-authorised OFF -> credentialled SHADOW activation boundary.
          ssh \
            -i ~/.ssh/opip_committee \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=60 \
            -p "$PORT" \
            "$USER@$HOST" \
            "sudo -n bash '$RELEASE_DIR/OHM-Trade-Agent-v1/deploy/committee/bootstrap-opip-committee-worker.sh' '$TARGET_SHA'" \
            2>&1 | tee committee-install.log
          RC=${PIPESTATUS[0]}
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          if [[ "$RC" -eq 0 ]]; then
            echo "result=INSTALLED" >> "$GITHUB_OUTPUT"
          else
            echo "result=FAILED" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Prove OFF-mode isolation
        id: committee_isolation
        if: always() && steps.committee_install.outputs.result == 'INSTALLED'
        continue-on-error: true
        env:
          HOST: ${{ secrets.OPIP_LEARNING_HOST }}
          USER: ${{ secrets.OPIP_LEARNING_USER }}
          PORT: ${{ secrets.OPIP_LEARNING_PORT }}
        run: |
          set +e
          PORT="${PORT:-22}"
          RELEASE_DIR="/var/tmp/opip-committee-${{ steps.target.outputs.sha }}-$GITHUB_RUN_ID"
          ssh \
            -i ~/.ssh/opip_committee \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "$PORT" \
            "$USER@$HOST" \
            "sudo -n bash '$RELEASE_DIR/OHM-Trade-Agent-v1/deploy/committee/verify-committee-isolation.sh'" \
            2>&1 | tee committee-isolation.log
          RC=${PIPESTATUS[0]}
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          # A missing ISOLATION_PROOF=PASS line is a failed proof even if the exit code
          # was zero, so the verdict is taken from the machine-readable line.
          if [[ "$RC" -eq 0 ]] && grep -q '^ISOLATION_PROOF=PASS$' committee-isolation.log; then
            echo "result=PROVEN" >> "$GITHUB_OUTPUT"
          else
            echo "result=FAILED" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Prove Committee runtime readiness
        id: committee_runtime
        if: always() && steps.committee_install.outputs.result == 'INSTALLED'
        continue-on-error: true
        env:
          HOST: ${{ secrets.OPIP_LEARNING_HOST }}
          USER: ${{ secrets.OPIP_LEARNING_USER }}
          PORT: ${{ secrets.OPIP_LEARNING_PORT }}
        run: |
          set +e
          PORT="${PORT:-22}"
          RELEASE_DIR="/var/tmp/opip-committee-${{ steps.target.outputs.sha }}-$GITHUB_RUN_ID"
          ssh \
            -i ~/.ssh/opip_committee \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "$PORT" \
            "$USER@$HOST" \
            "sudo -n bash '$RELEASE_DIR/OHM-Trade-Agent-v1/deploy/committee/verify-committee-runtime.sh'" \
            2>&1 | tee committee-runtime.log
          RC=${PIPESTATUS[0]}
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          if [[ "$RC" -eq 0 ]] && grep -q '^COMMITTEE_RUNTIME_PROOF=PASS$' committee-runtime.log; then
            echo "result=PROVEN" >> "$GITHUB_OUTPUT"
          else
            echo "result=FAILED" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Clean remote release
        id: committee_cleanup
        if: always() && steps.target.outputs.sha != ''
        env:
          HOST: ${{ secrets.OPIP_LEARNING_HOST }}
          USER: ${{ secrets.OPIP_LEARNING_USER }}
          PORT: ${{ secrets.OPIP_LEARNING_PORT }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set +e
          PORT="${PORT:-22}"
          RELEASE_DIR="/var/tmp/opip-committee-$TARGET_SHA-$GITHUB_RUN_ID"
          ssh \
            -i ~/.ssh/opip_committee \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "$PORT" \
            "$USER@$HOST" \
            "sudo -n rm -rf -- '$RELEASE_DIR'"
          RC=$?
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          # The temporary release directory must be gone. This is a success
          # requirement, not best effort: a leftover copy of the release tree on the
          # host is a real finding, so the step fails on a non-zero exit and the final
          # gate below also requires it. `set +e` is used only so the result is
          # captured and reported before the step fails.
          if [[ "$RC" -eq 0 ]]; then
            echo "result=CLEANED" >> "$GITHUB_OUTPUT"
          else
            echo "result=FAILED" >> "$GITHUB_OUTPUT"
          fi
          exit "$RC"

      - name: Publish committee deployment receipt
        if: always() && steps.target.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          INSTALL_RESULT: ${{ steps.committee_install.outputs.result }}
          INSTALL_RC: ${{ steps.committee_install.outputs.rc }}
          ISOLATION_RESULT: ${{ steps.committee_isolation.outputs.result }}
          ISOLATION_RC: ${{ steps.committee_isolation.outputs.rc }}
          RUNTIME_RESULT: ${{ steps.committee_runtime.outputs.result }}
          RUNTIME_RC: ${{ steps.committee_runtime.outputs.rc }}
          CLEANUP_RESULT: ${{ steps.committee_cleanup.outputs.result }}
          CLEANUP_RC: ${{ steps.committee_cleanup.outputs.rc }}
        run: |
          set -euo pipefail
          RUN_URL="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # The proof summary is the PASS/FAIL lines and the machine-readable verdict.
          # It contains no environment contents and no secret: the verification script
          # reports counts and statuses only.
          if [[ -f committee-isolation.log ]]; then
            PROOF="$(grep -E '^(PASS|FAIL|INFO|ISOLATION_PROOF=)' committee-isolation.log || true)"
          else
            PROOF="isolation proof did not run"
          fi
          if [[ -f committee-runtime.log ]]; then
            RUNTIME_PROOF="$(grep -E '^(PASS|FAIL|INFO|COMMITTEE_RUNTIME_PROOF=)' committee-runtime.log || true)"
          else
            RUNTIME_PROOF="runtime proof did not run"
          fi
          if [[ "${INSTALL_RESULT:-}" == "INSTALLED" \
            && "${ISOLATION_RESULT:-}" == "PROVEN" \
            && "${RUNTIME_RESULT:-}" == "PROVEN" \
            && "${CLEANUP_RESULT:-}" == "CLEANED" ]]; then
            DEPLOY_RESULT="PROVEN"
          else
            DEPLOY_RESULT="FAILED"
          fi
          BODY=$(cat <<EOF
          ## O'Pip Intelligence Committee Deployment Receipt

          - **Result:** ${DEPLOY_RESULT} (install: ${INSTALL_RESULT:-NOT RUN}; isolation: ${ISOLATION_RESULT:-NOT RUN}; runtime: ${RUNTIME_RESULT:-NOT RUN})
          - **SHA:** \`$TARGET_SHA\`
          - **Remote exit codes:** install=${INSTALL_RC:-N/A} isolation=${ISOLATION_RC:-N/A} runtime=${RUNTIME_RC:-N/A} cleanup=${CLEANUP_RC:-N/A}
          - **Remote cleanup:** ${CLEANUP_RESULT:-NOT RUN}
          - **Workflow run:** $RUN_URL

          \`\`\`
          $PROOF
          \`\`\`

          \`\`\`
          $RUNTIME_PROOF
          \`\`\`

          This workflow installs the isolated Committee worker at an exact main SHA with
          \`OPIP_COMMITTEE_MODE=off\` and proves OFF-mode isolation. No provider allowlist
          is configured: OFF-mode egress is deny-all and fails closed. The service and
          timer artifacts are installed, but the timer is left disabled and inactive, so
          no scheduled committee execution occurs. It does **not** activate credentialled
          SHADOW calls, enable provider execution, or place a provider key anywhere. It
          does not merge, and it does not touch Kraken or Telegram credentials.

          Success requires the install, the isolation proof, the runtime readiness
          proof, **and** removal of the temporary remote release directory.

          The \`OFF -> credentialled SHADOW\` transition requires a separate
          OWNER-authorised action with its own validation.
          EOF
          )
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/64/comments" -f body="$BODY" >/dev/null

      - name: Fail unless installed, isolation is proven, and the release is cleaned
        if: always()
        env:
          INSTALL_RESULT: ${{ steps.committee_install.outputs.result }}
          ISOLATION_RESULT: ${{ steps.committee_isolation.outputs.result }}
          RUNTIME_RESULT: ${{ steps.committee_runtime.outputs.result }}
          CLEANUP_RESULT: ${{ steps.committee_cleanup.outputs.result }}
        run: |
          set -euo pipefail
          # Fail closed: an install without a proven isolation result is not a success,
          # and a proven deployment with a failed remote cleanup is not a success either.
          test "$INSTALL_RESULT" = "INSTALLED" || {
            echo "Committee installation did not succeed." >&2
            exit 1
          }
          test "$ISOLATION_RESULT" = "PROVEN" || {
            echo "Committee OFF-mode isolation was not proven." >&2
            exit 1
          }
          test "$RUNTIME_RESULT" = "PROVEN" || {
            echo "Committee runtime readiness was not proven." >&2
            exit 1
          }
          test "$CLEANUP_RESULT" = "CLEANED" || {
            echo "The temporary remote release directory was not removed." >&2
            exit 1
          }
