name: deploy-production

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: 'Explicit production approval'
        required: true
        type: choice
        options:
          - CANCEL
          - DEPLOY
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read
  issues: read

concurrency:
  group: ohm-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' &&
       inputs.confirm_production == 'DEPLOY') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 64 &&
       github.event.comment.user.login == github.repository_owner &&
       github.event.comment.author_association == 'OWNER' &&
       startsWith(github.event.comment.body, '/deploy '))
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Resolve exact explicitly approved main SHA
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "issue_comment" ]]; then
            if [[ "$COMMENT_BODY" =~ ^/deploy[[:space:]]+([0-9a-f]{40})[[:space:]]*$ ]]; then
              TARGET_SHA="${BASH_REMATCH[1]}"
            else
              echo "Refusing production deploy: approval comment format is invalid." >&2
              exit 64
            fi
          else
            TARGET_SHA="$GITHUB_SHA"
          fi
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "Approved production SHA: $TARGET_SHA"

      - name: Require approved SHA to equal current main
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          test "$TARGET_SHA" = "$MAIN_SHA" || {
            echo "Refusing production deploy: approved SHA is not current main." >&2
            echo "approved=$TARGET_SHA current_main=$MAIN_SHA" >&2
            exit 65
          }

      - name: Require successful pytest CI for exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          RESULT="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow pytest.yml \
            --branch main \
            --commit "$TARGET_SHA" \
            --limit 1 \
            --json status,conclusion \
            --jq '.[0] | [.status,.conclusion] | @tsv')"
          test "$RESULT" = $'completed\tsuccess' || {
            echo "Refusing production deploy: exact SHA does not have a successful completed pytest run." >&2
            echo "CI result: ${RESULT:-not found}" >&2
            exit 1
          }

      - name: Validate deploy secrets
        env:
          OHM_DEPLOY_HOST: ${{ secrets.OHM_DEPLOY_HOST }}
          OHM_DEPLOY_USER: ${{ secrets.OHM_DEPLOY_USER }}
          OHM_DEPLOY_SSH_KEY: ${{ secrets.OHM_DEPLOY_SSH_KEY }}
          OHM_DEPLOY_KNOWN_HOSTS: ${{ secrets.OHM_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$OHM_DEPLOY_HOST"
          test -n "$OHM_DEPLOY_USER"
          test -n "$OHM_DEPLOY_SSH_KEY"
          test -n "$OHM_DEPLOY_KNOWN_HOSTS"

      - name: Configure SSH
        env:
          OHM_DEPLOY_SSH_KEY: ${{ secrets.OHM_DEPLOY_SSH_KEY }}
          OHM_DEPLOY_KNOWN_HOSTS: ${{ secrets.OHM_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$OHM_DEPLOY_SSH_KEY" > ~/.ssh/ohm_deploy
          chmod 600 ~/.ssh/ohm_deploy
          printf '%s\n' "$OHM_DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy exact approved and tested main commit
        env:
          OHM_DEPLOY_HOST: ${{ secrets.OHM_DEPLOY_HOST }}
          OHM_DEPLOY_USER: ${{ secrets.OHM_DEPLOY_USER }}
          OHM_DEPLOY_PORT: ${{ secrets.OHM_DEPLOY_PORT }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          PORT="${OHM_DEPLOY_PORT:-22}"
          ssh \
            -i ~/.ssh/ohm_deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "$PORT" \
            "$OHM_DEPLOY_USER@$OHM_DEPLOY_HOST" \
            "deploy $TARGET_SHA"
