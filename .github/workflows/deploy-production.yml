name: deploy-production

on:
  workflow_dispatch:
    inputs:
      release_profile:
        description: 'Allowlisted release profile'
        required: true
        type: choice
        options:
          - EVIDENCE_SHADOW
          - TARGET_PAPER
      confirm_production:
        description: 'Explicit production approval'
        required: true
        type: choice
        options:
          - CANCEL
          - DEPLOY
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: ohm-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' &&
       github.actor == github.repository_owner &&
       inputs.confirm_production == 'DEPLOY') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 64 &&
       github.event.comment.user.login == github.repository_owner &&
       github.event.comment.author_association == 'OWNER' &&
       (startsWith(github.event.comment.body, '/deploy-profile ') ||
        startsWith(github.event.comment.body, '/deploy ')))
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Resolve exact explicitly approved main SHA
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          DISPATCH_PROFILE: ${{ inputs.release_profile }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" \
            && "$ACTOR" != "$REPOSITORY_OWNER" ]]; then
            echo "Refusing production deploy: manual dispatch is repository-owner-only." >&2
            exit 64
          fi
          if [[ "$EVENT_NAME" == "issue_comment" ]]; then
            if [[ "$COMMENT_BODY" =~ ^/deploy-profile[[:space:]]+(EVIDENCE_SHADOW|TARGET_PAPER)[[:space:]]+([0-9a-f]{40})[[:space:]]*$ ]]; then
              PROFILE="${BASH_REMATCH[1]}"
              TARGET_SHA="${BASH_REMATCH[2]}"
            elif [[ "$COMMENT_BODY" =~ ^/deploy[[:space:]]+([0-9a-f]{40})[[:space:]]*$ ]]; then
              # Backward-compatible spelling, subject to the same explicit
              # EVIDENCE_SHADOW profile, exact-SHA and architecture gates.
              PROFILE="EVIDENCE_SHADOW"
              TARGET_SHA="${BASH_REMATCH[1]}"
            else
              echo "Refusing production deploy: approval comment format is invalid or profile is not allowlisted." >&2
              exit 64
            fi
          else
            PROFILE="$DISPATCH_PROFILE"
            TARGET_SHA="$GITHUB_SHA"
          fi
          case "$PROFILE" in
            EVIDENCE_SHADOW|TARGET_PAPER) ;;
            SAFE_BASELINE) echo "SAFE_BASELINE is rollback-only." >&2; exit 64 ;;
            *) echo "Refusing production deploy: release profile is not allowlisted." >&2; exit 64 ;;
          esac
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "Owner-approved release profile: $PROFILE"
          echo "Owner-approved production SHA: $TARGET_SHA"

      - name: Require approved SHA to equal current main
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          test "$TARGET_SHA" = "$MAIN_SHA" || {
            echo "Refusing production deploy: approved SHA is not current main." >&2
            echo "approved=$TARGET_SHA current_main=$MAIN_SHA" >&2
            exit 65
          }

      - name: Require successful pytest CI for exact SHA
        id: exact_ci
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          echo "status=UNPROVEN" >> "$GITHUB_OUTPUT"
          RESULT="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow pytest.yml \
            --branch main \
            --commit "$TARGET_SHA" \
            --limit 1 \
            --json status,conclusion \
            --jq '.[0] | [.status,.conclusion] | @tsv')"
          if [[ "$RESULT" == $'completed\tsuccess' ]]; then
            echo "status=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "status=FAIL" >> "$GITHUB_OUTPUT"
            echo "Refusing production deploy: exact SHA does not have a successful completed pytest run." >&2
            echo "CI result: ${RESULT:-not found}" >&2
            exit 1
          fi

      - name: Checkout and validate the exact-SHA release profile
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false

      - name: Require the architecture gate and profile at the approved SHA
        id: profile_gate
        env:
          PROFILE: ${{ steps.target.outputs.profile }}
        working-directory: OHM-Trade-Agent-v1
        run: |
          set -euo pipefail
          python -m pip install PyYAML
          python -m app.services.release_profiles --profile "$PROFILE" \
            | tee "$RUNNER_TEMP/release-architecture-gate.txt"
          grep -Fx 'ARCHITECTURE_GATE=PASS' "$RUNNER_TEMP/release-architecture-gate.txt"
          grep -Fx "PROFILE=$PROFILE" "$RUNNER_TEMP/release-architecture-gate.txt"
          grep -Fx 'NEW_ENTRY_AUTHORITY=LEGACY_ONLY' "$RUNNER_TEMP/release-architecture-gate.txt"
          grep -Fx 'FUNDED_AUTHORITY=ABSENT' "$RUNNER_TEMP/release-architecture-gate.txt"
          grep -Fx 'PAPER_V2=OFF' "$RUNNER_TEMP/release-architecture-gate.txt"
          grep -Fx 'COMMITTEE_MODE=off' "$RUNNER_TEMP/release-architecture-gate.txt"
          grep -Fx 'PROTECTION=INDEPENDENT' "$RUNNER_TEMP/release-architecture-gate.txt"
          echo "architecture_gate=PASS" >> "$GITHUB_OUTPUT"
          echo "feature_bus=$(grep -m1 '^FEATURE_BUS=' "$RUNNER_TEMP/release-architecture-gate.txt" | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "canonical_writer=$(grep -m1 '^CANONICAL_WRITER=' "$RUNNER_TEMP/release-architecture-gate.txt" | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "target_spine=$(grep -m1 '^TARGET_SPINE=' "$RUNNER_TEMP/release-architecture-gate.txt" | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "paper_v2=$(grep -m1 '^PAPER_V2=' "$RUNNER_TEMP/release-architecture-gate.txt" | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "committee_mode=$(grep -m1 '^COMMITTEE_MODE=' "$RUNNER_TEMP/release-architecture-gate.txt" | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "new_entry_authority=$(grep -m1 '^NEW_ENTRY_AUTHORITY=' "$RUNNER_TEMP/release-architecture-gate.txt" | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "funded_authority=$(grep -m1 '^FUNDED_AUTHORITY=' "$RUNNER_TEMP/release-architecture-gate.txt" | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "protection=$(grep -m1 '^PROTECTION=' "$RUNNER_TEMP/release-architecture-gate.txt" | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Recheck exact main SHA immediately before production deploy
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          test "$TARGET_SHA" = "$MAIN_SHA" || {
            echo "Refusing production deploy: main moved after approval validation." >&2
            exit 65
          }

      - name: Validate deploy secrets
        env:
          OHM_DEPLOY_HOST: ${{ secrets.OHM_DEPLOY_HOST }}
          OHM_DEPLOY_USER: ${{ secrets.OHM_DEPLOY_USER }}
          OHM_DEPLOY_SSH_KEY_B64: ${{ secrets.OHM_DEPLOY_SSH_KEY_B64 }}
          OHM_DEPLOY_KNOWN_HOSTS: ${{ secrets.OHM_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$OHM_DEPLOY_HOST"
          test -n "$OHM_DEPLOY_USER"
          test -n "$OHM_DEPLOY_SSH_KEY_B64"
          test -n "$OHM_DEPLOY_KNOWN_HOSTS"

      - name: Decode and validate SSH key
        id: ssh_config
        env:
          OHM_DEPLOY_SSH_KEY_B64: ${{ secrets.OHM_DEPLOY_SSH_KEY_B64 }}
          OHM_DEPLOY_KNOWN_HOSTS: ${{ secrets.OHM_DEPLOY_KNOWN_HOSTS }}
        run: |
          set +e
          install -m 700 -d ~/.ssh

          printf '%s' "$OHM_DEPLOY_SSH_KEY_B64" | base64 --decode > ~/.ssh/ohm_deploy 2>/dev/null
          DECODE_RC=$?
          chmod 600 ~/.ssh/ohm_deploy 2>/dev/null

          if [[ "$DECODE_RC" -ne 0 ]] || ! ssh-keygen -y -f ~/.ssh/ohm_deploy >/dev/null 2>&1; then
            rm -f ~/.ssh/ohm_deploy
            echo "SSH deploy key validation failed." >&2
            echo "result=SSH KEY INVALID" >> "$GITHUB_OUTPUT"
            echo "rc=66" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s\n' "$OHM_DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          echo "SSH deploy key decoded and validated successfully."
          echo "result=READY" >> "$GITHUB_OUTPUT"
          echo "rc=0" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Deploy exact approved and tested main commit
        id: production_deploy
        if: steps.ssh_config.outputs.result == 'READY'
        continue-on-error: true
        env:
          OHM_DEPLOY_HOST: ${{ secrets.OHM_DEPLOY_HOST }}
          OHM_DEPLOY_USER: ${{ secrets.OHM_DEPLOY_USER }}
          OHM_DEPLOY_PORT: ${{ secrets.OHM_DEPLOY_PORT }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          APPROVED_PROFILE: ${{ steps.target.outputs.profile }}
        run: |
          set +e
          PORT="${OHM_DEPLOY_PORT:-22}"

          run_deploy() {
            # One invocation of the owner-gated host deploy for the exact approved
            # target SHA. Called at most twice, and the second call is gated on the
            # bounded legacy-transition proof in `classify`.
            local log="$1"
            ssh \
              -i ~/.ssh/ohm_deploy \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=20 \
              -o TCPKeepAlive=yes \
              -p "$PORT" \
              "$OHM_DEPLOY_USER@$OHM_DEPLOY_HOST" \
              "deploy $TARGET_SHA" 2>&1 | tee "$log"
            return "${PIPESTATUS[0]}"
          }

          classify() {
            # classify <log> <rc> <legacy_allowed>
            #
            # Sets RESULT / HEALTH / ROLLBACK / GATE / core_status / learning_* and
            # TRANSITION_ELIGIBLE. Core release state and learning readiness are
            # separate facts: a healthy committed core whose learning export failed
            # must never be reported as a failed server deploy with an unknown
            # rollback.
            #
            # Values are captured with a permissive pattern and marker PRESENCE is
            # detected separately, because a restrictive pattern cannot tell an
            # absent marker from a malformed one. Treating a malformed value as
            # absent would let an incompatible ohm-deploy fall into the legacy path
            # and still publish SUCCESS from the learning markers alone.
            local log="$1" rc="$2" legacy_allowed="$3"
            CORE_STATUS="$(grep -oE 'OPIP_CORE_DEPLOY_STATUS=[^[:space:]]*' "$log" | tail -n 1 | cut -d= -f2)"
            LEARNING_EXPORT_STATUS="$(grep -oE 'OPIP_LEARNING_EXPORT_STATUS=[^[:space:]]*' "$log" | tail -n 1 | cut -d= -f2)"
            LEARNING_READINESS="$(grep -oE 'OPIP_LEARNING_READINESS=[^[:space:]]*' "$log" | tail -n 1 | cut -d= -f2)"
            POSTCOMMIT_HEALTH="$(grep -oE 'OPIP_CORE_POSTCOMMIT_HEALTH=[^[:space:]]*' "$log" | tail -n 1 | cut -d= -f2)"
            RUNTIME_VERIFICATION="$(grep -oE 'OPIP_RELEASE_RUNTIME_VERIFICATION=[^[:space:]]*' "$log" | tail -n 1 | cut -d= -f2)"
            RUNTIME_VERIFIED_AT="$(grep -oE 'OPIP_RELEASE_RUNTIME_VERIFIED_AT=[^[:space:]]*' "$log" | tail -n 1 | cut -d= -f2)"
            EVIDENCE_CAPTURE="$(grep -oE 'OPIP_RELEASE_EVIDENCE_CAPTURE=[^[:space:]]*' "$log" | tail -n 1 | cut -d= -f2)"
            DEPLOYED_PROFILE="$(grep -oE 'OPIP_RELEASE_PROFILE=[^[:space:]]*' "$log" | tail -n 1 | cut -d= -f2)"
            RUNTIME_PROTECTION="$(grep -oE 'OPIP_RELEASE_PROTECTION=[^[:space:]]*' "$log" | tail -n 1 | cut -d= -f2)"
            TARGET_AUTHORITY="$(grep -oE 'OPIP_RELEASE_TARGET_AUTHORITY=[^[:space:]]*' "$log" | tail -n 1 | cut -d= -f2)"
            RELEASE_SCHEDULER="$(grep -oE 'OPIP_RELEASE_SCHEDULER=[^[:space:]]*' "$log" | tail -n 1 | cut -d= -f2)"
            UNIFIED_CYCLE="$(grep -oE 'OPIP_UNIFIED_CYCLE=HEALTHY' "$log" | tail -n 1 | cut -d= -f2)"
            UNIFIED_CYCLE_COMPLETED_AT="$(grep -oE 'OPIP_UNIFIED_CYCLE_COMPLETED_AT=[^[:space:]]+' "$log" | tail -n 1 | cut -d= -f2)"
            GENESIS_STATUS="$(grep -oE 'OPIP_PAPER_REGISTRY_GENESIS_STATUS=[^[:space:]]*' "$log" | tail -n 1 | cut -d= -f2)"
            GENESIS_REASON="$(grep -oE 'OPIP_PAPER_REGISTRY_GENESIS_REASON=[^[:space:]]*' "$log" | tail -n 1 | cut -d= -f2)"
            PREFLIGHT_STATUS="$(grep -oE 'OPIP_PROTECTION_PREFLIGHT=(PASS|FAIL)' "$log" | tail -n 1 | cut -d= -f2)"
            PREFLIGHT_STATE="$(grep -oE 'OPIP_PROTECTION_PREFLIGHT_STATE=[^[:space:]]*' "$log" | tail -n 1 | cut -d= -f2)"
            PREFLIGHT_COVERAGE="$(grep -oE 'OPIP_PROTECTION_PREFLIGHT_COVERAGE_COMPLETE=(true|false)' "$log" | tail -n 1 | cut -d= -f2)"
            PREFLIGHT_ADMISSIONS="$(grep -oE 'OPIP_PROTECTION_PREFLIGHT_ADMISSIONS_SUSPENDED=(true|false)' "$log" | tail -n 1 | cut -d= -f2)"
            PREFLIGHT_CODES="$(grep -oE 'OPIP_PROTECTION_PREFLIGHT_REASON_CODES=[^[:space:]]*' "$log" | tail -n 1 | cut -d= -f2-)"
            PREFLIGHT_REASON="$(grep -E 'OPIP_PROTECTION_PREFLIGHT_RESOLUTION_REASON=' "$log" | tail -n 1 | cut -d= -f2-)"
            PREFLIGHT_UNMANAGED="$(grep -oE 'OPIP_PROTECTION_PREFLIGHT_UNMANAGED_EXPOSURES=[^[:space:]]*' "$log" | tail -n 1 | cut -d= -f2)"
            PREFLIGHT_UNCERTAIN="$(grep -oE 'OPIP_PROTECTION_PREFLIGHT_UNCERTAIN_EXPOSURES=[^[:space:]]*' "$log" | tail -n 1 | cut -d= -f2)"
            PREFLIGHT_SILENT="$(grep -oE 'OPIP_PROTECTION_PREFLIGHT_SILENT_HOLDINGS=[^[:space:]]*' "$log" | tail -n 1 | cut -d= -f2)"
            PREFLIGHT_INCIDENT="$(grep -oE 'OPIP_PROTECTION_PREFLIGHT_INCIDENT_HEALTH=[^[:space:]]*' "$log" | tail -n 1 | cut -d= -f2)"
            PRODUCTION_MUTATION="$(grep -oE 'OPIP_PRODUCTION_MUTATION=[^[:space:]]*' "$log" | tail -n 1 | cut -d= -f2)"
            if grep -q 'OPIP_CORE_DEPLOY_STATUS=' "$log"; then
              CORE_MARKER="PRESENT"
            else
              CORE_MARKER="ABSENT"
            fi

            # Core success requires the structured marker to say SUCCESS explicitly.
            # An ABSENT marker means the running ohm-deploy predates the contract
            # (it is reinstalled mid-deploy); that is the legacy path, handled as
            # UNPROVEN or as an eligible transition below - never as a core failure.
            # Any other combination is malformed and fails closed.
            #
            # The final health JSON is required ONLY on the legacy path, where it was
            # the sole core-commit evidence. The new path must not require it: a
            # failed final probe is reported by OPIP_CORE_POSTCOMMIT_HEALTH, and
            # requiring it here would let a failed post-commit observation
            # retroactively reclassify an already-committed core as a server failure.
            core_verdict="NONE"
            if [[ "$rc" -eq 0 ]] \
               && grep -q "O'Pip deployment succeeded" "$log" \
               && grep -q "O'Pip scheduler reconciliation: OK" "$log"; then
              case "${CORE_MARKER}:${CORE_STATUS}" in
                PRESENT:SUCCESS)
                  # EVIDENCE_SHADOW release decoupling: the unified cycle is a
                  # LEGACY observation surface, not part of the EVIDENCE_SHADOW
                  # evidence plane, so its completion is NOT a release gate. The
                  # authoritative prospective-evidence gate is the runtime
                  # verifier (RUNTIME_VERIFICATION=PASS + exact-SHA runtime
                  # marker). The unified-cycle observation is still parsed and
                  # reported in the receipt, but it is never required to be
                  # HEALTHY and is never fabricated.
                  if [[ "$RUNTIME_VERIFICATION" == "PASS" ]] \
                    && grep -Fxq "OPIP_RELEASE_RUNTIME_SHA=$TARGET_SHA" "$log" \
                    && [[ "$DEPLOYED_PROFILE" == "$APPROVED_PROFILE" ]] \
                    && [[ "$APPROVED_PROFILE" == "EVIDENCE_SHADOW" ]] \
                    && [[ "$EVIDENCE_CAPTURE" == "PASS" ]] \
                    && [[ "$RUNTIME_PROTECTION" == "HEALTHY" ]] \
                    && [[ "$TARGET_AUTHORITY" == "ABSENT" ]] \
                    && [[ "$RELEASE_SCHEDULER" == "UNIQUE_BOUNDED" ]]; then
                    core_verdict="PROVEN"
                  fi
                  ;;
                ABSENT:)
                  if grep -q '"status":"ok"' "$log"; then
                    core_verdict="LEGACY"
                  fi
                  ;;
                *) core_verdict="NONE" ;;
              esac
            fi

            TRANSITION_ELIGIBLE="NO"
            SAFE_BASELINE_ROLLBACK="UNPROVEN"
            if [[ "$legacy_allowed" == "1" && "$CORE_MARKER" == "ABSENT" ]]; then
              # A one-time transition may retry ONLY when the first invocation ran
              # under the pre-#247 contract and provably crossed its commit point.
              # Both such signals appear strictly after last-good-sha is written and
              # the rollback trap is disarmed:
              #   * "O'Pip scheduler reconciliation: OK" proves the run reached
              #     reconcile-scheduler.sh, which is what installs THIS target SHA's
              #     /usr/local/sbin/ohm-deploy - so the retry executes the new code;
              #   * the P1 retirement success strings prove the commit point itself
              #     was crossed (that step runs after last-good-sha + trap - ERR);
              #     and "O'Pip deployment succeeded" is the legacy end-of-run marker.
              # A genuine pre-commit failure (core/writer health, paper topology,
              # resource budget) never produces those, so it is never retried.
              if grep -q "O'Pip scheduler reconciliation: OK" "$log"; then
                if [[ "$core_verdict" == "LEGACY" ]]; then
                  TRANSITION_ELIGIBLE="YES"
                elif grep -q "O'Pip P1 shadow outbox retirement: OK" "$log" \
                  || grep -q 'disposition=RETIRED_OWNER_DISCARDED' "$log"; then
                  TRANSITION_ELIGIBLE="YES"
                fi
              fi
            fi

            if [[ "$core_verdict" != "NONE" ]]; then
              HEALTH="OK"
              ROLLBACK="NO"
              # Success requires EVERY independent fact, because each proves a
              # different thing and any one of them being unproven leaves the
              # release in a state that must not be reported as success:
              #
              #   OPIP_CORE_DEPLOY_STATUS=SUCCESS   the core release committed
              #   OPIP_PAPER_REGISTRY_GENESIS=OK    durable initialization
              #                                     provenance exists
              #   LEARNING_EXPORT_STATUS=SUCCESS    this export attempt succeeded
              #   LEARNING_READINESS=READY          a fresh committed replica for
              #                                     this exact SHA is proven
              #   POSTCOMMIT_HEALTH=OK              the final observation was clean
              #
              # Genesis provenance is a gate in its own right: a committed export
              # with no durable marker would leave a later missing registry
              # indistinguishable from virgin state, which is the ambiguity the
              # marker exists to remove.
              if [[ "$LEARNING_EXPORT_STATUS" == "SUCCESS" && "$LEARNING_READINESS" == "READY" ]]; then
                learning_verdict="PROVEN"
              elif [[ "$core_verdict" == "LEGACY" ]]; then
                learning_verdict="UNPROVEN"
              else
                learning_verdict="BLOCKED"
              fi
              # Genesis is only meaningful once the contract is running; a legacy
              # run emits no markers at all and is already caught by UNPROVEN.
              if [[ "$core_verdict" == "LEGACY" ]]; then
                genesis_verdict="NOT_APPLICABLE"
              elif [[ "$GENESIS_STATUS" == "OK" ]]; then
                genesis_verdict="PROVEN"
              else
                genesis_verdict="BLOCKED"
              fi

              parts=""
              [[ "$genesis_verdict" == "PROVEN" || "$genesis_verdict" == "NOT_APPLICABLE" ]] \
                || parts="PAPER REGISTRY GENESIS ${genesis_verdict}"
              [[ "$learning_verdict" == "PROVEN" ]] \
                || parts="${parts:+$parts + }LEARNING $learning_verdict"
              [[ "$POSTCOMMIT_HEALTH" == "OK" ]] \
                || parts="${parts:+$parts + }POST-COMMIT HEALTH ${POSTCOMMIT_HEALTH:-UNREPORTED}"
              if [[ -z "$parts" ]]; then
                RESULT="SUCCESS"
                SAFE_BASELINE_ROLLBACK="NOT_NEEDED"
              else
                RESULT="CORE DEPLOYED - $parts"
              fi
            elif [[ "$PREFLIGHT_STATUS" == "FAIL" ]] \
              && ! grep -Fxq 'OPIP_SAFE_BASELINE_ROLLBACK=SUCCESS' "$log"; then
              # Pre-mutation refusal. Production was not changed, so this is not
              # a rollback and not a failed activation.
              RESULT="PROTECTION PREFLIGHT BLOCKED"
              HEALTH="NOT STARTED"
              ROLLBACK="NOT REQUIRED"
              SAFE_BASELINE_ROLLBACK="NOT_REQUIRED"
              CORE_STATUS="NOT_STARTED"
              LEARNING_EXPORT_STATUS="NOT_STARTED"
              LEARNING_READINESS="NOT_APPLICABLE"
            elif grep -q 'rollback health and paper checks passed' "$log" \
              && grep -Fxq 'OPIP_SAFE_BASELINE_ROLLBACK=SUCCESS' "$log"; then
              RESULT="ROLLED BACK"
              HEALTH="PREVIOUS RELEASE OK"
              ROLLBACK="YES"
              SAFE_BASELINE_ROLLBACK="SUCCESS"
            elif grep -qiE 'Permission denied \(publickey\)|Too many authentication failures' "$log"; then
              RESULT="SSH AUTH FAILED"
              HEALTH="NOT CONFIRMED"
              ROLLBACK="NOT RUN"
            elif grep -qiE 'Host key verification failed|REMOTE HOST IDENTIFICATION HAS CHANGED|No .* host key is known' "$log"; then
              RESULT="HOST KEY FAILED"
              HEALTH="NOT CONFIRMED"
              ROLLBACK="NOT RUN"
            else
              RESULT="SERVER DEPLOY FAILED"
              HEALTH="NOT CONFIRMED"
              ROLLBACK="UNKNOWN OR FAILED"
            fi
          }

          run_deploy deploy.log
          RC=$?
          classify deploy.log "$RC" 1

          # ---------------------------------------------------------------------
          # ONE-TIME FIRST-DEPLOY TRANSITION.
          #
          # The first deploy after this contract ships executes the PREVIOUSLY
          # installed /usr/local/sbin/ohm-deploy: reconcile-scheduler.sh installs
          # the target-SHA script during the run, but the already-running process
          # keeps its old code, so it never emits the structured markers and (with
          # the paper registry still missing) aborts rc=70 at the exporter AFTER
          # committing the core.
          #
          # Because that run also installed the target-SHA deploy script, exactly
          # one further invocation of the SAME approved SHA completes the
          # transition under the new contract. Bounded to a single retry, only for
          # a provably-legacy transition (see `classify`), and never for a genuine
          # core failure. The operator is not asked to re-issue /deploy.
          # ---------------------------------------------------------------------
          TRANSITION_RETRY="NO"
          if [[ "$TRANSITION_ELIGIBLE" == "YES" ]]; then
            TRANSITION_RETRY="YES"
            echo "O'Pip deploy transition: legacy deployment detected (no structured markers, commit point crossed); performing exactly one transition retry against the newly installed target-SHA ohm-deploy" >&2
            run_deploy deploy-transition.log
            RC=$?
            # legacy_allowed=0: the retry must satisfy the full structured contract.
            classify deploy-transition.log "$RC" 0
          fi

          # The gate passes only when the core committed AND learning readiness was
          # proven AND the post-commit observation was clean. A committed core with a
          # blocked learning export is surfaced as a failed gate with an accurate
          # result label, never hidden behind exit 0 and never reported as a rollback.
          if [[ "$RESULT" == "SUCCESS" ]]; then
            GATE="PASS"
          else
            GATE="FAIL"
          fi

          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"
          echo "health=$HEALTH" >> "$GITHUB_OUTPUT"
          echo "rollback=$ROLLBACK" >> "$GITHUB_OUTPUT"
          echo "gate=$GATE" >> "$GITHUB_OUTPUT"
          echo "core_status=${CORE_STATUS:-UNKNOWN}" >> "$GITHUB_OUTPUT"
          echo "learning_export_status=${LEARNING_EXPORT_STATUS:-UNKNOWN}" >> "$GITHUB_OUTPUT"
          echo "learning_readiness=${LEARNING_READINESS:-UNKNOWN}" >> "$GITHUB_OUTPUT"
          echo "postcommit_health=${POSTCOMMIT_HEALTH:-UNKNOWN}" >> "$GITHUB_OUTPUT"
          echo "runtime_verification=${RUNTIME_VERIFICATION:-UNPROVEN}" >> "$GITHUB_OUTPUT"
          echo "runtime_verified_at=${RUNTIME_VERIFIED_AT:-NOT_VERIFIED}" >> "$GITHUB_OUTPUT"
          echo "evidence_capture=${EVIDENCE_CAPTURE:-UNPROVEN}" >> "$GITHUB_OUTPUT"
          echo "deployed_profile=${DEPLOYED_PROFILE:-UNPROVEN}" >> "$GITHUB_OUTPUT"
          echo "runtime_protection=${RUNTIME_PROTECTION:-UNPROVEN}" >> "$GITHUB_OUTPUT"
          echo "target_authority=${TARGET_AUTHORITY:-UNPROVEN}" >> "$GITHUB_OUTPUT"
          echo "release_scheduler=${RELEASE_SCHEDULER:-UNPROVEN}" >> "$GITHUB_OUTPUT"
          echo "unified_cycle=${UNIFIED_CYCLE:-UNPROVEN}" >> "$GITHUB_OUTPUT"
          echo "unified_cycle_completed_at=${UNIFIED_CYCLE_COMPLETED_AT:-UNPROVEN}" >> "$GITHUB_OUTPUT"
          echo "safe_baseline_rollback=$SAFE_BASELINE_ROLLBACK" >> "$GITHUB_OUTPUT"
          echo "genesis_status=${GENESIS_STATUS:-UNKNOWN}" >> "$GITHUB_OUTPUT"
          echo "genesis_reason=${GENESIS_REASON:-UNKNOWN}" >> "$GITHUB_OUTPUT"
          echo "transition_retry=$TRANSITION_RETRY" >> "$GITHUB_OUTPUT"
          echo "protection_preflight=${PREFLIGHT_STATUS:-UNPROVEN}" >> "$GITHUB_OUTPUT"
          echo "protection_preflight_state=${PREFLIGHT_STATE:-UNPROVEN}" >> "$GITHUB_OUTPUT"
          echo "protection_preflight_coverage=${PREFLIGHT_COVERAGE:-UNPROVEN}" >> "$GITHUB_OUTPUT"
          echo "protection_preflight_admissions_suspended=${PREFLIGHT_ADMISSIONS:-UNPROVEN}" >> "$GITHUB_OUTPUT"
          echo "protection_preflight_reason_codes=${PREFLIGHT_CODES:-UNPROVEN}" >> "$GITHUB_OUTPUT"
          echo "protection_preflight_resolution_reason=${PREFLIGHT_REASON:-UNPROVEN}" >> "$GITHUB_OUTPUT"
          echo "protection_preflight_unmanaged_exposures=${PREFLIGHT_UNMANAGED:-NONE}" >> "$GITHUB_OUTPUT"
          echo "protection_preflight_uncertain_exposures=${PREFLIGHT_UNCERTAIN:-NONE}" >> "$GITHUB_OUTPUT"
          echo "protection_preflight_silent_holdings=${PREFLIGHT_SILENT:-NONE}" >> "$GITHUB_OUTPUT"
          echo "protection_preflight_incident_health=${PREFLIGHT_INCIDENT:-UNPROVEN}" >> "$GITHUB_OUTPUT"
          echo "production_mutation=${PRODUCTION_MUTATION:-UNPROVEN}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish deployment receipt to approval issue
        if: always() && steps.target.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          RELEASE_PROFILE: ${{ steps.target.outputs.profile }}
          EXACT_CI_RESULT: ${{ steps.exact_ci.outputs.status }}
          ARCH_GATE: ${{ steps.profile_gate.outputs.architecture_gate }}
          FEATURE_BUS: ${{ steps.profile_gate.outputs.feature_bus }}
          CANONICAL_WRITER: ${{ steps.profile_gate.outputs.canonical_writer }}
          TARGET_SPINE: ${{ steps.profile_gate.outputs.target_spine }}
          PAPER_V2: ${{ steps.profile_gate.outputs.paper_v2 }}
          COMMITTEE_MODE: ${{ steps.profile_gate.outputs.committee_mode }}
          NEW_ENTRY_AUTHORITY: ${{ steps.profile_gate.outputs.new_entry_authority }}
          FUNDED_AUTHORITY: ${{ steps.profile_gate.outputs.funded_authority }}
          PROTECTION: ${{ steps.profile_gate.outputs.protection }}
          SSH_CONFIG_RESULT: ${{ steps.ssh_config.outputs.result }}
          SSH_CONFIG_RC: ${{ steps.ssh_config.outputs.rc }}
          DEPLOY_RESULT: ${{ steps.production_deploy.outputs.result }}
          HEALTH_RESULT: ${{ steps.production_deploy.outputs.health }}
          ROLLBACK_RESULT: ${{ steps.production_deploy.outputs.rollback }}
          DEPLOY_RC: ${{ steps.production_deploy.outputs.rc }}
          CORE_STATUS: ${{ steps.production_deploy.outputs.core_status }}
          LEARNING_EXPORT_STATUS: ${{ steps.production_deploy.outputs.learning_export_status }}
          LEARNING_READINESS: ${{ steps.production_deploy.outputs.learning_readiness }}
          POSTCOMMIT_HEALTH: ${{ steps.production_deploy.outputs.postcommit_health }}
          RUNTIME_VERIFICATION: ${{ steps.production_deploy.outputs.runtime_verification }}
          RUNTIME_VERIFIED_AT: ${{ steps.production_deploy.outputs.runtime_verified_at }}
          EVIDENCE_CAPTURE: ${{ steps.production_deploy.outputs.evidence_capture }}
          DEPLOYED_PROFILE: ${{ steps.production_deploy.outputs.deployed_profile }}
          RUNTIME_PROTECTION: ${{ steps.production_deploy.outputs.runtime_protection }}
          TARGET_AUTHORITY: ${{ steps.production_deploy.outputs.target_authority }}
          RELEASE_SCHEDULER: ${{ steps.production_deploy.outputs.release_scheduler }}
          UNIFIED_CYCLE: ${{ steps.production_deploy.outputs.unified_cycle }}
          UNIFIED_CYCLE_COMPLETED_AT: ${{ steps.production_deploy.outputs.unified_cycle_completed_at }}
          SAFE_BASELINE_ROLLBACK: ${{ steps.production_deploy.outputs.safe_baseline_rollback }}
          GENESIS_STATUS: ${{ steps.production_deploy.outputs.genesis_status }}
          GENESIS_REASON: ${{ steps.production_deploy.outputs.genesis_reason }}
          TRANSITION_RETRY: ${{ steps.production_deploy.outputs.transition_retry }}
          PROTECTION_PREFLIGHT: ${{ steps.production_deploy.outputs.protection_preflight }}
          PROTECTION_PREFLIGHT_STATE: ${{ steps.production_deploy.outputs.protection_preflight_state }}
          PROTECTION_PREFLIGHT_COVERAGE: ${{ steps.production_deploy.outputs.protection_preflight_coverage }}
          PROTECTION_PREFLIGHT_ADMISSIONS_SUSPENDED: ${{ steps.production_deploy.outputs.protection_preflight_admissions_suspended }}
          PROTECTION_PREFLIGHT_REASON_CODES: ${{ steps.production_deploy.outputs.protection_preflight_reason_codes }}
          PROTECTION_PREFLIGHT_RESOLUTION_REASON: ${{ steps.production_deploy.outputs.protection_preflight_resolution_reason }}
          PROTECTION_PREFLIGHT_UNMANAGED_EXPOSURES: ${{ steps.production_deploy.outputs.protection_preflight_unmanaged_exposures }}
          PROTECTION_PREFLIGHT_UNCERTAIN_EXPOSURES: ${{ steps.production_deploy.outputs.protection_preflight_uncertain_exposures }}
          PROTECTION_PREFLIGHT_SILENT_HOLDINGS: ${{ steps.production_deploy.outputs.protection_preflight_silent_holdings }}
          PROTECTION_PREFLIGHT_INCIDENT_HEALTH: ${{ steps.production_deploy.outputs.protection_preflight_incident_health }}
          PRODUCTION_MUTATION: ${{ steps.production_deploy.outputs.production_mutation }}
        run: |
          set -euo pipefail
          RESULT="${DEPLOY_RESULT:-${SSH_CONFIG_RESULT:-FAILED BEFORE SSH}}"
          HEALTH="${HEALTH_RESULT:-NOT CONFIRMED}"
          if [[ "$RESULT" == "SSH KEY INVALID" || "$RESULT" == "SSH AUTH FAILED" || "$RESULT" == "HOST KEY FAILED" ]]; then
            ROLLBACK="NOT RUN"
          else
            ROLLBACK="${ROLLBACK_RESULT:-NOT RUN}"
          fi
          RC="${DEPLOY_RC:-${SSH_CONFIG_RC:-N/A}}"
          RUN_URL="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          # Core release state and learning readiness are reported separately so a
          # healthy committed core with a blocked learning export is never
          # described as a failed or rolled-back deployment.
          BODY=$(cat <<EOF
          **Core health:** $HEALTH
          **Learning export:** ${LEARNING_EXPORT_STATUS:-UNKNOWN}
          **Learning readiness:** ${LEARNING_READINESS:-UNKNOWN}

          SHA=$TARGET_SHA
          PROFILE=$RELEASE_PROFILE
          DEPLOYED_PROFILE=${DEPLOYED_PROFILE:-UNPROVEN}
          DEPLOY_RESULT=$RESULT
          ARCHITECTURE_GATE=${ARCH_GATE:-UNPROVEN}
          PYTEST=${EXACT_CI_RESULT:-UNPROVEN}
          ATDD_SCOPE=${EXACT_CI_RESULT:-UNPROVEN}
          SECURITY=${EXACT_CI_RESULT:-UNPROVEN}
          PROTECTION=${RUNTIME_PROTECTION:-UNVERIFIED}
          PROTECTION_POSTURE=${PROTECTION:-UNVERIFIED}
          FEATURE_BUS=${FEATURE_BUS:-UNPROVEN}
          CANONICAL_WRITER=${CANONICAL_WRITER:-UNPROVEN}
          TARGET_SPINE=${TARGET_SPINE:-UNPROVEN}
          PAPER_V2=${PAPER_V2:-UNPROVEN}
          COMMITTEE_MODE=${COMMITTEE_MODE:-UNPROVEN}
          NEW_ENTRY_AUTHORITY=${NEW_ENTRY_AUTHORITY:-UNPROVEN}
          FUNDED_AUTHORITY=${FUNDED_AUTHORITY:-UNPROVEN}
          EVIDENCE_CAPTURE=${EVIDENCE_CAPTURE:-UNVERIFIED}
          TARGET_AUTHORITY=${TARGET_AUTHORITY:-UNVERIFIED}
          RELEASE_SCHEDULER=${RELEASE_SCHEDULER:-UNVERIFIED}
          UNIFIED_CYCLE=${UNIFIED_CYCLE:-UNVERIFIED}
          UNIFIED_CYCLE_COMPLETED_AT=${UNIFIED_CYCLE_COMPLETED_AT:-UNVERIFIED}
          ROLLBACK=$ROLLBACK
          SAFE_BASELINE_ROLLBACK=${SAFE_BASELINE_ROLLBACK:-UNVERIFIED}
          RUNTIME_VERIFIED_AT=${RUNTIME_VERIFIED_AT:-NOT_VERIFIED}

          CORE_HEALTH=$HEALTH
          CORE_STATUS=${CORE_STATUS:-UNKNOWN}
          LEARNING_EXPORT_STATUS=${LEARNING_EXPORT_STATUS:-UNKNOWN}
          LEARNING_READINESS=${LEARNING_READINESS:-UNKNOWN}
          POSTCOMMIT_HEALTH=${POSTCOMMIT_HEALTH:-UNKNOWN}
          PAPER_REGISTRY_GENESIS=${GENESIS_STATUS:-UNKNOWN}
          TRANSITION_RETRY=${TRANSITION_RETRY:-NO}
          PROTECTION_PREFLIGHT=${PROTECTION_PREFLIGHT:-UNPROVEN}
          PROTECTION_PREFLIGHT_STATE=${PROTECTION_PREFLIGHT_STATE:-UNPROVEN}
          PROTECTION_COVERAGE_COMPLETE=${PROTECTION_PREFLIGHT_COVERAGE:-UNPROVEN}
          PROTECTION_ADMISSIONS_SUSPENDED=${PROTECTION_PREFLIGHT_ADMISSIONS_SUSPENDED:-UNPROVEN}
          PROTECTION_REASON_CODES=${PROTECTION_PREFLIGHT_REASON_CODES:-UNPROVEN}
          PROTECTION_RESOLUTION_REASON=${PROTECTION_PREFLIGHT_RESOLUTION_REASON:-UNPROVEN}
          PROTECTION_UNMANAGED_EXPOSURES=${PROTECTION_PREFLIGHT_UNMANAGED_EXPOSURES:-NONE}
          PROTECTION_UNCERTAIN_EXPOSURES=${PROTECTION_PREFLIGHT_UNCERTAIN_EXPOSURES:-NONE}
          PROTECTION_SILENT_HOLDINGS=${PROTECTION_PREFLIGHT_SILENT_HOLDINGS:-NONE}
          PROTECTION_INCIDENT_HEALTH=${PROTECTION_PREFLIGHT_INCIDENT_HEALTH:-UNPROVEN}
          PRODUCTION_MUTATION=${PRODUCTION_MUTATION:-UNPROVEN}
          DEPLOY_EXIT_CODE=$RC
          WORKFLOW_RUN=$RUN_URL
          EOF
          )

          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/issues/64/comments" \
            -f body="$BODY" >/dev/null

      - name: Fail workflow unless the deployment gate fully passed
        if: always() && steps.production_deploy.outputs.gate != 'PASS'
        run: |
          RESULT="${{ steps.production_deploy.outputs.result }}"
          if [[ -z "$RESULT" ]]; then
            RESULT="${{ steps.ssh_config.outputs.result }}"
          fi
          echo "Production deployment gate: ${RESULT:-FAILED BEFORE SSH}" >&2
          if [[ "$RESULT" == "PROTECTION PREFLIGHT BLOCKED" ]]; then
            echo "Core deployment: NOT STARTED" >&2
            echo "Production mutation: NO" >&2
            echo "Rollback: NOT REQUIRED" >&2
            echo "Protection state: ${{ steps.production_deploy.outputs.protection_preflight_state }}" >&2
            echo "Coverage complete: ${{ steps.production_deploy.outputs.protection_preflight_coverage }}" >&2
            echo "Reason codes: ${{ steps.production_deploy.outputs.protection_preflight_reason_codes }}" >&2
            echo "Resolution reason: ${{ steps.production_deploy.outputs.protection_preflight_resolution_reason }}" >&2
            echo "Unmanaged exposures: ${{ steps.production_deploy.outputs.protection_preflight_unmanaged_exposures }}" >&2
            echo "Uncertain exposures: ${{ steps.production_deploy.outputs.protection_preflight_uncertain_exposures }}" >&2
            echo "Silent holdings: ${{ steps.production_deploy.outputs.protection_preflight_silent_holdings }}" >&2
            echo "Incident health: ${{ steps.production_deploy.outputs.protection_preflight_incident_health }}" >&2
            echo "Learning export: NOT STARTED" >&2
          fi
          echo "Core deployment: ${{ steps.production_deploy.outputs.core_status || 'UNKNOWN' }}" >&2
          echo "Learning export: ${{ steps.production_deploy.outputs.learning_export_status || 'UNKNOWN' }}" >&2
          echo "Learning readiness: ${{ steps.production_deploy.outputs.learning_readiness || 'UNKNOWN' }}" >&2
          exit 1

  diagnose-learning:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 64 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.body == '/diagnose-learning'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate diagnostics secrets
        env:
          OHM_DEPLOY_HOST: ${{ secrets.OHM_DEPLOY_HOST }}
          OHM_DEPLOY_USER: ${{ secrets.OHM_DEPLOY_USER }}
          OHM_DEPLOY_SSH_KEY_B64: ${{ secrets.OHM_DEPLOY_SSH_KEY_B64 }}
          OHM_DEPLOY_KNOWN_HOSTS: ${{ secrets.OHM_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$OHM_DEPLOY_HOST"
          test -n "$OHM_DEPLOY_USER"
          test -n "$OHM_DEPLOY_SSH_KEY_B64"
          test -n "$OHM_DEPLOY_KNOWN_HOSTS"

      - name: Decode diagnostics SSH key
        env:
          OHM_DEPLOY_SSH_KEY_B64: ${{ secrets.OHM_DEPLOY_SSH_KEY_B64 }}
          OHM_DEPLOY_KNOWN_HOSTS: ${{ secrets.OHM_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$OHM_DEPLOY_SSH_KEY_B64" | base64 --decode > ~/.ssh/ohm_deploy
          chmod 600 ~/.ssh/ohm_deploy
          ssh-keygen -y -f ~/.ssh/ohm_deploy >/dev/null
          printf '%s\n' "$OHM_DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Run read-only learning diagnostics
        id: diagnose
        env:
          OHM_DEPLOY_HOST: ${{ secrets.OHM_DEPLOY_HOST }}
          OHM_DEPLOY_USER: ${{ secrets.OHM_DEPLOY_USER }}
          OHM_DEPLOY_PORT: ${{ secrets.OHM_DEPLOY_PORT }}
        run: |
          set +e
          PORT="${OHM_DEPLOY_PORT:-22}"
          ssh \
            -i ~/.ssh/ohm_deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=5 \
            -p "$PORT" \
            "$OHM_DEPLOY_USER@$OHM_DEPLOY_HOST" \
            "diagnose-learning" 2>&1 | tee diagnostics.log
          RC=${PIPESTATUS[0]}
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish learning diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DIAG_RC: ${{ steps.diagnose.outputs.rc }}
        run: |
          set -euo pipefail
          if [[ -s diagnostics.log ]]; then
            DIAGNOSTICS="$(tail -c 20000 diagnostics.log)"
          else
            DIAGNOSTICS="Diagnostics command did not produce output."
          fi
          RUN_URL="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          BODY=$(cat <<EOF
          ## O'Pip Learning Diagnostics
          - **Remote exit code:** ${DIAG_RC:-N/A}
          - **Workflow run:** $RUN_URL

          \`\`\`text
          $DIAGNOSTICS
          \`\`\`
          EOF
          )
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/issues/64/comments" \
            -f body="$BODY" >/dev/null

      - name: Fail if diagnostics command failed
        if: steps.diagnose.outputs.rc != '0'
        run: exit 1
