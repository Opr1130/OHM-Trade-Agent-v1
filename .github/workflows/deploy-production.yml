name: deploy-production

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: 'Explicit production approval'
        required: true
        type: choice
        options:
          - CANCEL
          - DEPLOY

permissions:
  contents: read
  actions: read

concurrency:
  group: ohm-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirm_production == 'DEPLOY'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Resolve exact main SHA
        id: target
        run: |
          set -euo pipefail
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "Approved production SHA: ${GITHUB_SHA}"

      - name: Require successful pytest CI for exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          RESULT="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow pytest.yml \
            --branch main \
            --commit "$TARGET_SHA" \
            --limit 1 \
            --json status,conclusion \
            --jq '.[0] | [.status,.conclusion] | @tsv')"
          test "$RESULT" = $'completed\tsuccess' || {
            echo "Refusing production deploy: exact SHA does not have a successful completed pytest run." >&2
            echo "CI result: ${RESULT:-not found}" >&2
            exit 1
          }

      - name: Validate deploy secrets
        env:
          OHM_DEPLOY_HOST: ${{ secrets.OHM_DEPLOY_HOST }}
          OHM_DEPLOY_USER: ${{ secrets.OHM_DEPLOY_USER }}
          OHM_DEPLOY_SSH_KEY: ${{ secrets.OHM_DEPLOY_SSH_KEY }}
          OHM_DEPLOY_KNOWN_HOSTS: ${{ secrets.OHM_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$OHM_DEPLOY_HOST"
          test -n "$OHM_DEPLOY_USER"
          test -n "$OHM_DEPLOY_SSH_KEY"
          test -n "$OHM_DEPLOY_KNOWN_HOSTS"

      - name: Configure SSH
        env:
          OHM_DEPLOY_SSH_KEY: ${{ secrets.OHM_DEPLOY_SSH_KEY }}
          OHM_DEPLOY_KNOWN_HOSTS: ${{ secrets.OHM_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$OHM_DEPLOY_SSH_KEY" > ~/.ssh/ohm_deploy
          chmod 600 ~/.ssh/ohm_deploy
          printf '%s\n' "$OHM_DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy exact approved and tested main commit
        env:
          OHM_DEPLOY_HOST: ${{ secrets.OHM_DEPLOY_HOST }}
          OHM_DEPLOY_USER: ${{ secrets.OHM_DEPLOY_USER }}
          OHM_DEPLOY_PORT: ${{ secrets.OHM_DEPLOY_PORT }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          PORT="${OHM_DEPLOY_PORT:-22}"
          ssh \
            -i ~/.ssh/ohm_deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "$PORT" \
            "$OHM_DEPLOY_USER@$OHM_DEPLOY_HOST" \
            "deploy $TARGET_SHA"
