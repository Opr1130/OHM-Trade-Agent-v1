name: m07-cutover-toolkit

# Linux qualification for the Mission 07 V2 cutover toolkit (deploy/m07).
#
# This workflow closes exactly the two gates R3 could not prove on the authoring
# workstation (see OHM-Trade-Agent-v1/deploy/m07/R3-RELEASE-QUALIFICATION.md §2):
#
#   R3-G1  Linux-native `bash -n` of the delivered LF-only host scripts
#   R3-G3  `docker compose config` against a real Compose implementation
#
# It also runs the offline regression suite on Linux, including the recovery
# and rollback safety contracts.
#
# Scope: read-only. Nothing here contacts a host, starts a container, touches a
# database, reads a secret, or grants deployment / writer / scheduler / trading
# authority. The Compose step only *renders* the certified file.

on:
  pull_request:
    branches: [main]
    paths:
      - 'OHM-Trade-Agent-v1/deploy/m07/**'
      - 'OHM-Trade-Agent-v1/docker-compose.yml'
      - 'OHM-Trade-Agent-v1/deploy/remote/ohm-deploy'
      - '.github/workflows/m07-cutover-toolkit.yml'
  push:
    branches: [main]
    paths:
      - 'OHM-Trade-Agent-v1/deploy/m07/**'
      - 'OHM-Trade-Agent-v1/docker-compose.yml'
      - 'OHM-Trade-Agent-v1/deploy/remote/ohm-deploy'
      - '.github/workflows/m07-cutover-toolkit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m07-cutover-toolkit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-qualification:
    name: Linux shell, Compose and offline regressions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OHM-Trade-Agent-v1/deploy/m07
    steps:
      - uses: actions/checkout@v4
        with:
          # The toolkit-location regression extracts the certified commit with
          # `git archive`; a depth-1 clone cannot see c196dd67.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the test dependencies
        # The recovery path imports the certified app (`app.services.registry_io`
        # -> httpx), so the app's pinned runtime requirements are required.
        # PyYAML is needed by the Compose-contract tests and is installed the
        # same way pytest.yml does.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$GITHUB_WORKSPACE/OHM-Trade-Agent-v1/requirements.txt"
          python -m pip install 'PyYAML>=6,<7'

      - name: R3-G1a - delivered bytes are LF-only with a bash shebang
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          scripts = ("scripts/v2/bootstrap-v2.sh", "scripts/v2/rollback-v2.sh")
          for name in scripts:
              raw = Path(name).read_bytes()
              assert b"\r\n" not in raw, f"{name}: CRLF found"
              assert raw.startswith(b"#!/usr/bin/env bash\n"), f"{name}: bad shebang"
          print("LF-only + shebang: PASS")
          PY
          bash --version | head -1

      - name: R3-G1b - Linux-native bash syntax
        run: |
          set -euo pipefail
          bash -n scripts/v2/bootstrap-v2.sh
          bash -n scripts/v2/rollback-v2.sh
          echo "bash -n: PASS"

      - name: Python syntax
        run: python -m compileall -q scripts tests

      - name: R3-G3 - Compose renders from the certified file only
        working-directory: OHM-Trade-Agent-v1
        run: |
          set -euo pipefail
          docker compose version

          # Controller parity: the host scripts invoke Compose exactly as
          # deploy/remote/ohm-deploy does - no `-f` overlay on the core stack.
          ! grep -q 'docker compose -f' deploy/m07/scripts/v2/bootstrap-v2.sh
          grep -Fq '( cd "$APP_ROOT" && docker compose "$@" )' \
            deploy/m07/scripts/v2/bootstrap-v2.sh

          # Never render over a stale activation file. `.env` is required only
          # because the core service declares `env_file: .env`; it is created
          # empty here and removed on exit, so no value is injected anywhere.
          test ! -e .env
          : > .env
          trap 'rm -f .env' EXIT

          docker compose config --quiet
          docker compose config --services | sort > /tmp/m07-services.txt
          cat /tmp/m07-services.txt
          printf '%s\n' \
            ohm-dashboard-edge \
            ohm-trade-agent \
            opip-canonical-writer \
            opip-stream-worker | sort > /tmp/m07-expected.txt
          diff -u /tmp/m07-expected.txt /tmp/m07-services.txt
          echo "compose render: PASS (4 services, no overlay)"

      - name: Recovery and rollback safety contracts
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m pytest \
            tests/scenarios/test_hf02_recovery_gate.py \
            tests/scenarios/test_r3_concurrency_and_compose.py \
            -q

      - name: R3 offline regression suite (116 tests)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m pytest tests/scenarios -q

  r3-g2-rehearsal:
    name: R3-G2 disposable-host rehearsal (synthetic; subset explicit)
    # A disposable GitHub-hosted Ubuntu runner with Docker. Every identity fact
    # below is produced by an isolated local IMDS stub and is labelled SIMULATED;
    # nothing here contacts production, reads a secret, or attests the real V2
    # droplet. The production identity gate itself is unchanged and unweakened.
    runs-on: ubuntu-latest
    needs: linux-qualification
    timeout-minutes: 45
    env:
      M07: ${{ github.workspace }}/OHM-Trade-Agent-v1/deploy/m07
      CERT_SHA: c196dd674678b3b1ee91c351ee97c1c9e2b3938d
      APP_ROOT: /opt/OHM-Trade-Agent-v1/OHM-Trade-Agent-v1
      STATE: /var/lib/opip-bootstrap
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$GITHUB_WORKSPACE/OHM-Trade-Agent-v1/requirements.txt"
          python -m pip install 'PyYAML>=6,<7'

      - name: Build the certified image from the pinned commit
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cert"
          git archive "$CERT_SHA" | tar -x -C "$RUNNER_TEMP/cert"
          docker build \
            --build-arg "OPIP_RELEASE_SHA=$CERT_SHA" \
            -t opip-v2:certified-c196dd67 \
            "$RUNNER_TEMP/cert/OHM-Trade-Agent-v1"
          docker image inspect -f '{{.Id}} {{json .Config.Labels}}' opip-v2:certified-c196dd67 \
            | tee "$RUNNER_TEMP/image-identity.txt"

      - name: Stage the immutable release source (root-only, reproducing L-01)
        run: |
          set -euo pipefail
          sudo mkdir -p "/srv/opip-v2/releases/$CERT_SHA"
          sudo cp -a "$RUNNER_TEMP/cert/OHM-Trade-Agent-v1" "/srv/opip-v2/releases/$CERT_SHA/"
          sudo chown -R root:root "/srv/opip-v2/releases/$CERT_SHA"
          sudo chmod 0700 "/srv/opip-v2/releases/$CERT_SHA"
          sudo test -d "/srv/opip-v2/releases/$CERT_SHA/OHM-Trade-Agent-v1"
          echo "root-only release staged; unprivileged access must fail"

      - name: Isolated IMDS stub (SIMULATED identity)
        run: |
          set -euo pipefail
          sudo ip addr add 169.254.169.254/32 dev lo 2>/dev/null || true
          mkdir -p "$RUNNER_TEMP/imds/metadata/v1"
          printf '610307364' > "$RUNNER_TEMP/imds/metadata/v1/id"
          sudo nohup python3 -m http.server 80 --bind 169.254.169.254 \
            --directory "$RUNNER_TEMP/imds" >"$RUNNER_TEMP/imds.log" 2>&1 &
          disown || true
          for _ in $(seq 1 15); do
            if curl -fsS http://169.254.169.254/metadata/v1/id >/dev/null 2>&1; then break; fi
            sleep 1
          done
          test "$(curl -fsS http://169.254.169.254/metadata/v1/id)" = "610307364"
          {
            echo "IDENTITY_ATTESTATION=SIMULATED"
            echo "REASON=isolated runner stub on 169.254.169.254; production identity remains UNPROVEN"
          } | tee "$RUNNER_TEMP/identity-attestation.txt"

      - name: Provision the toolkit from this reviewed commit
        run: |
          set -euo pipefail
          SHA="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          sudo bash "$M07/scripts/v2/bootstrap-v2.sh" --mode provision-toolkit \
            --from "$M07" --source-sha "$SHA" --to /opt/opip-m07-toolkit
          sudo /opt/opip-m07-toolkit/scripts/v2/bootstrap-v2.sh --mode check-toolkit

      - name: Synthetic environment (no real secrets)
        run: |
          set -euo pipefail
          sudo mkdir -p "$APP_ROOT"
          sudo tee "$APP_ROOT/.env" >/dev/null <<'ENV'
          WEBHOOK_SECRET=synthetic-r3-g2-only-not-a-real-secret
          APP_ENV=rehearsal
          TELEGRAM_ENABLED=false
          OPENAI_API_KEY=
          OPIP_RELEASE_PROFILE=EVIDENCE_SHADOW
          OPIP_PAPER_V2_MODE=off
          OPIP_CANONICAL_WRITER_MODE=shadow
          OPIP_FEATURE_BUS_MODE=shadow
          OPIP_TARGET_SPINE_MODE=shadow
          ENV
          sudo chown root:root "$APP_ROOT/.env"
          sudo chmod 0600 "$APP_ROOT/.env"

      - name: Prepare (identity, release, image, protection preflight)
        run: |
          set -euo pipefail
          sudo /opt/opip-m07-toolkit/scripts/v2/bootstrap-v2.sh --mode prepare \
            | tee "$RUNNER_TEMP/prepare.json"

      - name: Authorize (synthetic owner evidence)
        id: authorize
        # A protection preflight that is BLOCKED cannot be acknowledged unless the
        # toolkit itself classifies the host as fresh-host-only. On a host with no
        # exchange credentials it does not, and it must not: authorizing there
        # would bypass a protection gate. The rehearsal records that refusal as a
        # blocker and keeps execute/writer/scheduler UNPROVEN.
        continue-on-error: true
        run: |
          set -euo pipefail
          ACK=""
          if sudo python3 - "$STATE/BOOTSTRAP_PREPARED.json" <<'PY'
          import json, sys
          doc = json.load(open(sys.argv[1], encoding="utf-8"))
          raise SystemExit(0 if (doc.get("ready") is not True and doc.get("fresh_host_only") is True) else 1)
          PY
          then ACK="--acknowledge-fresh-host"; fi
          sudo /opt/opip-m07-toolkit/scripts/v2/bootstrap-v2.sh --mode authorize \
            --confirm-sha "$CERT_SHA" --confirm-host 610307364 $ACK \
            2>&1 | tee "$RUNNER_TEMP/authorize.log"

      - name: Bind the project-scoped images to the certified image id
        if: steps.authorize.outcome == 'success'
        run: |
          set -euo pipefail
          # APP_ROOT is not installed until execute, so render the certified file
          # from the immutable source with the same project name the bootstrap
          # will use (APP_ROOT's directory name). The .env is synthetic.
          cd "$RUNNER_TEMP/cert/OHM-Trade-Agent-v1"
          sudo cp "$APP_ROOT/.env" .env
          sudo docker compose -p OHM-Trade-Agent-v1 config --format json > "$RUNNER_TEMP/compose.json"
          python3 "$M07/scripts/opip_image.py" resolve \
            --compose-json "$RUNNER_TEMP/compose.json" --out "$RUNNER_TEMP/images.json"
          IMAGE_ID="$(sudo docker image inspect -f '{{.Id}}' opip-v2:certified-c196dd67)"
          for name in $(python3 -c 'import json,sys;print(" ".join(json.load(open(sys.argv[1]))["images"].values()))' "$RUNNER_TEMP/images.json"); do
            sudo docker tag "$IMAGE_ID" "$name"
            echo "tagged $name -> $IMAGE_ID"
          done

      - name: Execute (core only, writer stays OFF)
        if: steps.authorize.outcome == 'success'
        run: |
          set -euo pipefail
          sudo /opt/opip-m07-toolkit/scripts/v2/bootstrap-v2.sh --mode execute \
            | tee "$RUNNER_TEMP/execute.json"
          sudo test ! -e "$STATE/WRITER_ACTIVATED.json"
          if sudo docker ps --format '{{.Names}}' | grep -qx 'opip-canonical-writer'; then
            echo "REFUSED: writer started during execute" >&2
            exit 1
          fi

      - name: PostConfiguration checks on the installed release
        if: steps.authorize.outcome == 'success'
        run: |
          set -euo pipefail
          {
            sudo /opt/opip-m07-toolkit/scripts/v2/bootstrap-v2.sh --mode check-release
            sudo stat -c '%a %U' "$APP_ROOT/.env"
            cd "$APP_ROOT"
            sudo docker compose config \
              | grep -E 'mem_limit|cpus|OPIP_PAPER_V2_MODE|OPIP_CANONICAL_WRITER_MODE' | sort -u
            sudo docker compose config --volumes
            sudo docker compose run --rm --no-deps ohm-trade-agent \
              python -m app.services.release_profiles --profile EVIDENCE_SHADOW
          } | tee "$RUNNER_TEMP/postconfiguration.txt"

      - name: Synthetic V1 source, export and provenance
        run: |
          set -euo pipefail
          cd "$M07"
          export OPIP_CERTIFIED_SRC="$RUNNER_TEMP/cert"
          export PYTHONDONTWRITEBYTECODE=1
          FIX="$RUNNER_TEMP/v1"
          python tests/make_fixture.py --root "$FIX" > "$RUNNER_TEMP/fixture.json"
          # The disposable core may create a fresh store at epoch 1. Publish a
          # synthetic generation at epoch 2 so the restore has newer history and
          # the guard is exercised rather than bypassed. Synthetic data only.
          python3 - "$RUNNER_TEMP/cert" "$FIX" "$CERT_SHA" <<'PY'
          import sys
          from pathlib import Path
          cert, root, sha = Path(sys.argv[1]) / "OHM-Trade-Agent-v1", Path(sys.argv[2]), sys.argv[3]
          sys.path.insert(0, str(cert))
          from app.opip.canonical.backup import publish_backup_generation
          from app.opip.canonical.writer import CanonicalWriter
          live = root / "data/opip/canonical/opip_canonical_v1.sqlite3"
          backups = live.parent / "backups"
          writer = CanonicalWriter(live)
          try:
              writer.advance_history_epoch_for_restore()
              writer.checkpoint_wal()
          finally:
              writer.close()
          for stale in backups.glob("*"):
              stale.unlink()
          publish_backup_generation(live, backups, source_release_sha=sha, generation_id="R3G2")
          PY
          python scripts/opip_bundle.py inventory --source-root "$FIX" \
            --spec drafts/v1-dataset-spec.json --out "$RUNNER_TEMP/inventory.json"
          python scripts/opip_bundle.py export --source-root "$FIX" \
            --spec drafts/v1-dataset-spec.json --out-dir "$RUNNER_TEMP/bundles" \
            --bundle-name r3g2 --canonical-dir "$FIX/data/opip/canonical/backups" \
            --cutoff "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --identity-proof fixture \
            --allow-synthetic-canonical --authorize --out "$RUNNER_TEMP/export.json"
          BUNDLE="$RUNNER_TEMP/bundles/r3g2"
          python scripts/opip_bundle.py verify --bundle "$BUNDLE" \
            --workdir "$RUNNER_TEMP/verify" --out "$RUNNER_TEMP/verify.json"
          python scripts/opip_bundle.py stage --bundle "$BUNDLE" \
            --staging "$RUNNER_TEMP/staging" --out "$RUNNER_TEMP/stage.json"

      - name: Linux native restore on a disposable destination
        # Runs even when authorisation is blocked: this exercises the real Linux
        # restore code and the writer gate without any bootstrap authority.
        run: |
          set -euo pipefail
          cd "$M07"
          export PYTHONDONTWRITEBYTECODE=1
          BUNDLE="$RUNNER_TEMP/bundles/r3g2"
          LIVE="$RUNNER_TEMP/rehearsal-app/data/opip/canonical/opip_canonical_v1.sqlite3"
          mkdir -p "$(dirname "$LIVE")"
          python3 scripts/opip_recovery.py restore-canonical --bundle "$BUNDLE" \
            --app-root "$RUNNER_TEMP/cert/OHM-Trade-Agent-v1" --live-db "$LIVE" \
            --authorize --receipt-out "$RUNNER_TEMP/canonical-recovery-receipt.json" \
            | tee "$RUNNER_TEMP/restore.json"
          python3 scripts/opip_rollback_guard.py writer-gate \
            --receipt "$RUNNER_TEMP/canonical-recovery-receipt.json" --db "$LIVE" \
            | tee "$RUNNER_TEMP/writer-gate.json"
          python3 - "$LIVE" <<'PY'
          import json, sqlite3, sys
          conn = sqlite3.connect(f"file:{sys.argv[1]}?mode=ro", uri=True)
          try:
              epoch, seq = conn.execute(
                  "SELECT history_epoch, next_local_sequence FROM meta WHERE id = 1"
              ).fetchone()
              events = conn.execute("SELECT COUNT(*) FROM events").fetchone()[0]
              integrity = conn.execute("PRAGMA integrity_check").fetchone()[0]
              fk = len(conn.execute("PRAGMA foreign_key_check").fetchall())
          finally:
              conn.close()
          facts = {"history_epoch": epoch, "next_local_sequence": seq,
                   "event_count": events, "integrity": integrity, "fk": fk}
          print(json.dumps(facts))
          assert epoch == 3, facts
          assert seq == 1, facts
          assert events == 4, facts
          assert integrity == "ok" and fk == 0, facts
          PY


      - name: Linux native canonical restore and writer gate
        if: steps.authorize.outcome == 'success'
        run: |
          set -euo pipefail
          cd "$M07"
          export PYTHONDONTWRITEBYTECODE=1
          BUNDLE="$RUNNER_TEMP/bundles/r3g2"
          LIVE_DB="$APP_ROOT/data/opip/canonical/opip_canonical_v1.sqlite3"
          sudo mkdir -p /var/lib/opip-migration
          sudo python3 scripts/opip_recovery.py restore-canonical --bundle "$BUNDLE" \
            --app-root "$APP_ROOT" --live-db "$LIVE_DB" \
            --authorize --receipt-out /var/lib/opip-migration/canonical-recovery-receipt.json \
            | tee "$RUNNER_TEMP/restore.json"
          sudo python3 scripts/opip_rollback_guard.py writer-gate \
            --receipt /var/lib/opip-migration/canonical-recovery-receipt.json \
            --db "$LIVE_DB" | tee "$RUNNER_TEMP/writer-gate.json"

      - name: Activate exactly one writer
        if: steps.authorize.outcome == 'success'
        run: |
          set -euo pipefail
          sudo /opt/opip-m07-toolkit/scripts/v2/bootstrap-v2.sh --mode activate-writer \
            | tee "$RUNNER_TEMP/activate-writer.json"
          RUNNING="$(sudo docker ps --format '{{.Names}}' | grep -cx 'opip-canonical-writer' || true)"
          test "$RUNNING" = "1"
          set +e
          sudo /opt/opip-m07-toolkit/scripts/v2/bootstrap-v2.sh --mode activate-writer \
            >"$RUNNER_TEMP/activate-writer-second.log" 2>&1
          SECOND=$?
          set -e
          test "$SECOND" -eq 3
          echo "second activate-writer refused with exit $SECOND"

      - name: Scheduler refuses before HTTPS and Telegram acceptance
        if: steps.authorize.outcome == 'success'
        run: |
          set -euo pipefail
          sudo test ! -e "$STATE/SCHEDULER_ACTIVATED.json"
          set +e
          sudo /opt/opip-m07-toolkit/scripts/v2/bootstrap-v2.sh --mode activate-scheduler \
            >"$RUNNER_TEMP/activate-scheduler.log" 2>&1
          RC=$?
          set -e
          test "$RC" -eq 3
          sudo test ! -e "$STATE/SCHEDULER_ACTIVATED.json"
          echo "scheduler refused with exit $RC and wrote no activation receipt"

      - name: WAL snapshot and safe rollback comparison
        run: |
          set -euo pipefail
          cd "$M07"
          LIVE_DB="$RUNNER_TEMP/rehearsal-app/data/opip/canonical/opip_canonical_v1.sqlite3"
          python3 scripts/opip_rollback_guard.py snapshot --db "$LIVE_DB" \
            --out "$RUNNER_TEMP/canonical-snapshot.sqlite3" | tee "$RUNNER_TEMP/snapshot.json"
          sudo python3 - "$LIVE_DB" "$RUNNER_TEMP/plan.json" <<'PY'
          import json, sqlite3, sys
          db, out = sys.argv[1:3]
          conn = sqlite3.connect(f"file:{db}?mode=ro", uri=True)
          try:
              epoch, seq = conn.execute(
                  "SELECT history_epoch, next_local_sequence FROM meta WHERE id = 1"
              ).fetchone()
              events = conn.execute("SELECT COUNT(*) FROM events").fetchone()[0]
          finally:
              conn.close()
          json.dump({"live_at_prepare": {"history_epoch": epoch,
                                         "next_local_sequence": seq,
                                         "event_count": events}}, open(out, "w"))
          PY
          sudo python3 scripts/opip_rollback_guard.py compare \
            --plan "$RUNNER_TEMP/plan.json" --db "$LIVE_DB" | tee "$RUNNER_TEMP/compare.json"

      - name: Negative paths and failure preservation
        run: |
          set -euo pipefail
          cd "$M07"
          export PYTHONDONTWRITEBYTECODE=1
          # A tampered transfer artifact fails integrity before extraction.
          cp -a "$RUNNER_TEMP/bundles/r3g2" "$RUNNER_TEMP/tampered"
          ARCHIVE="$(ls "$RUNNER_TEMP/tampered"/*.tar | head -n 1)"
          printf 'TAMPER' >> "$ARCHIVE"
          set +e
          python scripts/opip_bundle.py verify --archive "$ARCHIVE" \
            --workdir "$RUNNER_TEMP/tamper-work" --out "$RUNNER_TEMP/verify-tampered.json"
          TAMPER_RC=$?
          set -e
          test "$TAMPER_RC" -eq 1
          echo "tampered archive refused with exit $TAMPER_RC"
          # Promotion requires a persisted recovery receipt.
          set +e
          python scripts/opip_bundle.py promote --staging "$RUNNER_TEMP/staging" \
            --target "$RUNNER_TEMP/promote-target" --authorize \
            --out "$RUNNER_TEMP/promote-refused.json"
          PROMOTE_RC=$?
          set -e
          test "$PROMOTE_RC" -eq 3
          echo "promotion without a receipt refused with exit $PROMOTE_RC"
          # Authorization with the wrong SHA is refused after execution too.
          set +e
          sudo /opt/opip-m07-toolkit/scripts/v2/bootstrap-v2.sh --mode authorize \
            --confirm-sha 0000000000000000000000000000000000000000 \
            --confirm-host 610307364 >"$RUNNER_TEMP/authorize-wrong-sha.log" 2>&1
          WRONG_RC=$?
          set -e
          test "$WRONG_RC" -eq 3
          echo "wrong-SHA authorization refused with exit $WRONG_RC"

      - name: Rehearsal disposition (executed subset is explicit)
        if: always()
        run: |
          set -euo pipefail
          AUTH="${{ steps.authorize.outcome }}"
          if [ "$AUTH" = "success" ]; then
            {
              echo "R3_G2_DISPOSITION=FULL_CHAIN_EXECUTED"
              echo "identity=SIMULATED; production identity UNPROVEN"
            } | tee -a "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/disposition.txt"
          elif grep -q 'preflight is blocked' "$RUNNER_TEMP/authorize.log"; then
            {
              echo "R3_G2_DISPOSITION=UNPROVEN_SUBSET"
              echo "executed=image-identity,release-staging,simulated-identity,toolkit-provision,prepare,synthetic-export,linux-native-restore,writer-gate,wal-snapshot,negatives"
              echo "blocked_at=authorize"
              echo "reason=protection preflight BLOCKED because private exchange credentials are absent; the gate correctly refused (no synthetic exchange credentials are permitted)"
              echo "unmet=execute,core-start,postconfiguration,app-root-restore,activate-writer,scheduler,full-rollback"
              echo "identity_attestation=SIMULATED"
              echo "production_identity=UNPROVEN"
            } | tee -a "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/disposition.txt"
          else
            echo "unexpected authorization failure" >&2
            tail -n 30 "$RUNNER_TEMP/authorize.log" >&2 || true
            exit 1
          fi
          sudo test -s "$STATE/BOOTSTRAP_PREPARED.json"
          test -s "$RUNNER_TEMP/restore.json"
          test -s "$RUNNER_TEMP/writer-gate.json"

      - name: Collect qualification evidence
        if: always()
        run: |
          set -euo pipefail
          EVIDENCE="$RUNNER_TEMP/evidence"
          mkdir -p "$EVIDENCE"
          sudo cp -a "$STATE" "$EVIDENCE/bootstrap-state" 2>/dev/null || true
          sudo cp -a /var/lib/opip-migration "$EVIDENCE/migration" 2>/dev/null || true
          sudo cp /var/log/opip-bootstrap.log "$EVIDENCE/opip-bootstrap.log" 2>/dev/null || true
          sudo docker ps -a --format '{{.Names}}|{{.Status}}|{{.Image}}' \
            > "$EVIDENCE/containers.txt" 2>/dev/null || true
          sudo docker logs ohm-trade-agent > "$EVIDENCE/core.log" 2>&1 || true
          cp "$RUNNER_TEMP"/*.json "$EVIDENCE/" 2>/dev/null || true
          cp "$RUNNER_TEMP"/*.txt "$EVIDENCE/" 2>/dev/null || true
          cp "$RUNNER_TEMP"/*.log "$EVIDENCE/" 2>/dev/null || true
          {
            echo "# R3-G2 disposable-host rehearsal"
            echo "commit=$GITHUB_SHA"
            echo "head_sha=${GITHUB_HEAD_SHA:-$GITHUB_SHA}"
            echo "certified_sha=$CERT_SHA"
            echo "identity_attestation=SIMULATED"
            echo "production_identity=UNPROVEN"
            echo "host=$(hostname)"
            echo "kernel=$(uname -srm)"
            echo "docker=$(docker version --format '{{.Server.Version}}')"
          } > "$EVIDENCE/SUMMARY.md"
          sudo chown -R "$(id -u):$(id -g)" "$EVIDENCE"
          ls -l "$EVIDENCE"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r3-g2-rehearsal-evidence
          path: ${{ runner.temp }}/evidence
          if-no-files-found: warn

      - name: Stop the disposable stack
        if: always()
        run: |
          (cd "$APP_ROOT" && sudo docker compose down -v --remove-orphans) || true
          sudo pkill -f "http.server 80" || true




