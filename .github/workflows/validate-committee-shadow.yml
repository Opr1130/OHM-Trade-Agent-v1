          PROOF="$(grep -E '^(PRE_CANARY_OFF_ISOLATION=|CREDENTIAL_CANARY_PROOF=|POST_CANARY_OFF_ISOLATION=)' committee-shadow-canary.log 2>/dev/null || true)"
          BODY=$(cat <<EOF
