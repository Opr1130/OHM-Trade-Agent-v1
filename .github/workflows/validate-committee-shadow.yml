          RELEASE_DIR="/var/tmp/opip-committee-canary-$TARGET_SHA-$GITHUB_RUN_ID"
          ssh             -i ~/.ssh/opip_committee             -o BatchMode=yes             -o IdentitiesOnly=yes             -o StrictHostKeyChecking=yes             -p "$PORT"             "$USER@$HOST"             "sudo -n sh -c 'systemctl stop opip-committee-credential-canary.service >/dev/null 2>&1 || true; rm -f /run/opip/committee-credential-canary.env /run/opip/committee-credential-canary-hosts /run/systemd/system/opip-committee-credential-canary.service.d/10-provider-egress.conf /etc/systemd/system/opip-committee-credential-canary.service /usr/local/sbin/run-committee-credential-canary.sh; rmdir /run/systemd/system/opip-committee-credential-canary.service.d >/dev/null 2>&1 || true; systemctl daemon-reload >/dev/null 2>&1 || true; rm -rf -- "$RELEASE_DIR"'"
          RC=$?
