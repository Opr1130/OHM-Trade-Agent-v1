name: v6 build slice
description: One small unit of v6 work for the automated builder. Add the `build` label to start it.
title: "v6 slice: "
labels: []
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: One or two sentences. What changes and why.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: GIVEN / WHEN / THEN, one per criterion. Each becomes an acceptance test.
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Files likely involved
      description: Paths the builder should start from. Never .github/, deploy/, CLAUDE.md or AGENTS.md.
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: What the builder must not touch.
    validations:
      required: true
  - type: input
    id: depends_on
    attributes:
      label: Depends on
      description: Issue numbers that must be merged first, or "none".
    validations:
      required: true
