name: ohm-paper

services:
  ohm-freqtrade-paper-init:
    image: alpine:3.20
    container_name: ohm-freqtrade-paper-init
    restart: "no"
    network_mode: none
    user: "0:0"
    read_only: true
    mem_limit: 32m
    cpus: "0.05"
    pids_limit: 32
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mkdir -p \
          /freqtrade/state/logs \
          /freqtrade/user_data_usd/strategies \
          /freqtrade/user_data_usdt/strategies
        chown -R 1000:1000 \
          /freqtrade/state \
          /freqtrade/user_data_usd \
          /freqtrade/user_data_usdt
        chmod 0755 \
          /freqtrade/state \
          /freqtrade/state/logs \
          /freqtrade/user_data_usd \
          /freqtrade/user_data_usd/strategies \
          /freqtrade/user_data_usdt \
          /freqtrade/user_data_usdt/strategies
        chmod 0755 /freqtrade/bridge /freqtrade/control
        for REQUIRED in \
          /freqtrade/bridge/pairlist_usd.json \
          /freqtrade/bridge/pairlist_usdt.json \
          /freqtrade/bridge/signals.json \
          /freqtrade/control/control.json; do
          test -s "$$REQUIRED" || {
            echo "Missing required OHM paper file: $$REQUIRED" >&2
            exit 1
          }
          chmod 0644 "$$REQUIRED"
        done
    volumes:
      - ./data/freqtrade/user_data:/freqtrade/user_data_usd
      - ./data/freqtrade/user_data_usdt:/freqtrade/user_data_usdt
      - ./data/freqtrade/state:/freqtrade/state
      - ./data/freqtrade_bridge:/freqtrade/bridge
      - ./data/paper_trading:/freqtrade/control

  ohm-freqtrade-paper:
    image: freqtradeorg/freqtrade:2026.7
    container_name: ohm-freqtrade-paper
    restart: unless-stopped
    depends_on:
      ohm-freqtrade-paper-init:
        condition: service_completed_successfully
    # USD and USDT are intentionally isolated. A worker OOM/restart cannot
    # recycle its sibling, while paper activation still requires both healthy.
    mem_limit: 384m
    memswap_limit: 384m
    cpus: "0.20"
    pids_limit: 128
    oom_score_adj: 500
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - paper-egress
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - |
        set -Eeuo pipefail
        mkdir -p /freqtrade/user_data/strategies /freqtrade/state/logs
        for REQUIRED in \
          /freqtrade/user_data/bridge/pairlist_usd.json \
          /freqtrade/user_data/bridge/signals.json \
          /freqtrade/control/control.json; do
          test -r "$$REQUIRED" && test -s "$$REQUIRED" || {
            echo "Unreadable required OHM paper file: $$REQUIRED" >&2
            exit 1
          }
        done
        rm -f /freqtrade/state/heartbeat_USD
        exec freqtrade trade \
          --logfile /freqtrade/state/logs/ohm-freqtrade-paper-usd.log \
          --db-url sqlite:////freqtrade/state/tradesv3.ohm_dry_run_usd.sqlite \
          --config /freqtrade/config/config.json \
          --strategy OHMExternalSignalStrategy
    volumes:
      - ./data/freqtrade/user_data:/freqtrade/user_data
      - ./data/freqtrade/state:/freqtrade/state
      - ./data/freqtrade_bridge:/freqtrade/user_data/bridge:ro
      - ./data/paper_trading:/freqtrade/control:ro
      - ./freqtrade/user_data/config.json:/freqtrade/config/config.json:ro
      - ./freqtrade/user_data/strategies/OHMExternalSignalStrategy.py:/freqtrade/user_data/strategies/OHMExternalSignalStrategy.py:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f /freqtrade/state/heartbeat_USD && find /freqtrade/state/heartbeat_USD -mmin -1 -print -quit | grep -q ."
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 45s

  ohm-freqtrade-paper-usdt:
    image: freqtradeorg/freqtrade:2026.7
    container_name: ohm-freqtrade-paper-usdt
    restart: unless-stopped
    depends_on:
      ohm-freqtrade-paper-init:
        condition: service_completed_successfully
    mem_limit: 384m
    memswap_limit: 384m
    cpus: "0.20"
    pids_limit: 128
    oom_score_adj: 500
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - paper-egress
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - |
        set -Eeuo pipefail
        mkdir -p /freqtrade/user_data/strategies /freqtrade/state/logs
        for REQUIRED in \
          /freqtrade/user_data/bridge/pairlist_usdt.json \
          /freqtrade/user_data/bridge/signals.json \
          /freqtrade/control/control.json; do
          test -r "$$REQUIRED" && test -s "$$REQUIRED" || {
            echo "Unreadable required OHM paper file: $$REQUIRED" >&2
            exit 1
          }
        done
        rm -f /freqtrade/state/heartbeat_USDT
        exec freqtrade trade \
          --logfile /freqtrade/state/logs/ohm-freqtrade-paper-usdt.log \
          --db-url sqlite:////freqtrade/state/tradesv3.ohm_dry_run_usdt.sqlite \
          --config /freqtrade/config/config_usdt.json \
          --strategy OHMExternalSignalStrategy
    volumes:
      - ./data/freqtrade/user_data_usdt:/freqtrade/user_data
      - ./data/freqtrade/state:/freqtrade/state
      - ./data/freqtrade_bridge:/freqtrade/user_data/bridge:ro
      - ./data/paper_trading:/freqtrade/control:ro
      - ./freqtrade/user_data/config_usdt.json:/freqtrade/config/config_usdt.json:ro
      - ./freqtrade/user_data/strategies/OHMExternalSignalStrategy.py:/freqtrade/user_data/strategies/OHMExternalSignalStrategy.py:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f /freqtrade/state/heartbeat_USDT && find /freqtrade/state/heartbeat_USDT -mmin -1 -print -quit | grep -q ."
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 45s

networks:
  paper-egress:
    driver: bridge
