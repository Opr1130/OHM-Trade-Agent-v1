user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    access_log /dev/stdout;
    server_tokens off;

    resolver 127.0.0.11 ipv6=off valid=10s;

    server {
        listen 8443 ssl;
        server_name 161-35-106-207.sslip.io;

        ssl_certificate /etc/letsencrypt/live/161-35-106-207.sslip.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/161-35-106-207.sslip.io/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:1m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        location = /dashboard {
            set $ohm_backend http://ohm-trade-agent:8000;
            proxy_pass $ohm_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            add_header Cache-Control "no-store" always;
        }

        location = /dashboard/ {
            return 308 /dashboard;
        }

        location = /api/analytics/summary {
            limit_except GET {
                deny all;
            }
            set $ohm_backend http://ohm-trade-agent:8000;
            proxy_pass $ohm_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            add_header Cache-Control "no-store" always;
        }

        location = /api/analytics/intelligence {
            limit_except GET {
                deny all;
            }
            set $ohm_backend http://ohm-trade-agent:8000;
            proxy_pass $ohm_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            add_header Cache-Control "no-store" always;
        }

        location / {
            return 404;
        }
    }
}
