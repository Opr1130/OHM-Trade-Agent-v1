apiVersion: 1

datasources:
  - name: O'Pip Analytics PostgreSQL
    uid: opip-analytics-postgres
    type: postgres
    access: proxy
    isDefault: true
    editable: false
    url: $OPIP_GRAFANA_POSTGRES_HOST:$OPIP_GRAFANA_POSTGRES_PORT
    user: $OPIP_GRAFANA_DB_USER
    secureJsonData:
      password: $OPIP_GRAFANA_DB_PASSWORD
    jsonData:
      database: $OPIP_GRAFANA_DB_NAME
      sslmode: $OPIP_GRAFANA_DB_SSLMODE
      tlsConfigurationMethod: file-path
      sslRootCertFile: /etc/grafana/certs/postgres-ca.crt
      postgresVersion: 1700
      timescaledb: false
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
