# Opt-in overlay ONLY. Must be combined with tracked docker-compose.yml by
# the exact-SHA, owner-gated release controller after CI/host preflight.
# Never execute this compose file by itself.
services:
  ohm-dashboard-edge:
    image: opip-dashboard-edge-v2:${OPIP_DEPLOYED_SHA:?exact release SHA required}
    build:
      context: .
      dockerfile: deploy/control-center/Dockerfile.edge
    volumes:
      - ./deploy/control-center/nginx:/etc/nginx/opip-control-center:ro
    # No new ports, credentials, networks, resource allowances, or trading services.
