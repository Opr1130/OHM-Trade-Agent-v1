# Included only when the optional V2 edge overlay is explicitly deployed.
# No catch-all API proxy: only the existing protected O'Pip routes are forwarded.
location = /dashboard/v2 {
    return 308 /dashboard/v2/;
}
location ^~ /dashboard/v2/ {
    alias /usr/share/nginx/html/opip-control-center/;
    include /etc/nginx/mime.types;
    index index.html;
    # Do not serve index.html for missing assets or unknown dashboard paths.
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'" always;
}
location = /api/opip/zero-trade-explanation {
    limit_except GET { deny all; }
    set $opip_v2_backend http://ohm-trade-agent:8000;
    proxy_pass $opip_v2_backend$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    add_header Cache-Control "no-store" always;
}
location = /api/opip/scoring-comparison {
