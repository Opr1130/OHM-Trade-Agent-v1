# B/C-4 read-only Cockpit — Cockpit-ONLY Compose surface.
#
# WHY THIS FILE EXISTS SEPARATELY FROM docker-compose.yml
# =====================================================
# Docker Compose interpolates the ENTIRE file it is given before selecting a single
# service. `docker compose -f docker-compose.yml build opip-cockpit` therefore parsed
# and interpolated the Grafana and PostgreSQL services too, and the shared file contains
# mandatory variables such as
#
#   GF_SECURITY_ADMIN_USER: ${OPIP_GRAFANA_ADMIN_USER:?set in /etc/opip-data-platform.env}
#
# so a Cockpit-only deployment failed on the analytics host with
#
#   error while interpolating services.opip-grafana.environment.GF_SECURITY_ADMIN_USER:
#   required variable OPIP_GRAFANA_ADMIN_USER is missing a value
#
# even though bootstrap correctly dispatched `cockpit-ready` before the PostgreSQL/
# Grafana shell plane. Shell-level isolation cannot isolate Compose interpolation; only a
# separate Compose file can. This file contains the Cockpit and nothing else, so it
# renders and runs with every PostgreSQL/Grafana variable absent.
#
# This is the single definition of the Cockpit service. It is deliberately NOT also
# declared in docker-compose.yml: a second copy would be dead configuration and would
# drift from the hardening here. Bootstrap starts the Cockpit (for `cockpit-ready` and
# for `reads-ready`) exclusively through this file.
#
# `name:` must match docker-compose.yml. It is what makes this project the same
# `opip-data-platform` project, so the Cockpit joins the existing internal
# `opip-data-platform_opip-analytics` network instead of creating a second network with
# an overlapping subnet. The network declaration below is kept identical to the one in
# docker-compose.yml, and a regression test pins the two together.

name: opip-data-platform

services:
  # Serves the analytical Cockpit API on the analytics plane, where the verified
  # canonical replica is mounted. This is what keeps the Paper-v2 ledger/portfolio
  # workload off the trading host: the trading host has no replica, so it cannot
  # compute analytics even by misconfiguration.
  #
  # Reuses the existing repository image and the existing replica bridge; it adds no
  # droplet, database, scheduler or credentials. It runs the cockpit-only ASGI app
  # rather than the trading entry point, so this container cannot start trading
  # subsystems, and it holds no exchange or Telegram authority.
  #
  # Exposure mirrors the existing Grafana model: the service listens on the
  # container interface and is published ONLY to host loopback, where the host's TLS
  # reverse proxy terminates and forwards. The analytics network is internal, so
  # binding to loopback *inside* the container would be unreachable from the host and
  # from the proxy. Port 8000 is never published to a public interface.
  opip-cockpit:
    build:
      context: ../..
    image: opip-data-platform:${OPIP_DEPLOYED_SHA:-local}
    container_name: opip-cockpit
    restart: unless-stopped
    env_file:
      - /etc/opip-cockpit.env
    environment:
      # OPIP_CANONICAL_REPLICA_ROOT is deliberately NOT set here. Bootstrap writes it
      # into /etc/opip-cockpit.env, resolved to the committed generation under
      # `generations/<id>`: the mounted parent is a repository of generations selected
      # by a plain-text `current` pointer, so it holds no manifest and no canonical
      # database, and pinning it here would point the Cockpit at a directory that is
      # not a bundle. The application default (DEFAULT_REPLICA_ROOT,
      # /app/canonical-replica) still applies if the env file omits the key.
      OPIP_COCKPIT_HTTP_PORT: ${OPIP_COCKPIT_HTTP_PORT:-8000}
      PYTHONDONTWRITEBYTECODE: "1"
    command:
      - uvicorn
      - app.api.cockpit_service:app
      - --host
      - 0.0.0.0
      - --port
      - ${OPIP_COCKPIT_HTTP_PORT:-8000}
    ports:
      # Host-loopback only. The bind address is explicitly defaulted to 127.0.0.1 so
      # an unset variable can never widen exposure to a public interface.
      - "${OPIP_COCKPIT_BIND_ADDRESS:-127.0.0.1}:${OPIP_COCKPIT_HOST_PORT:-8000}:${OPIP_COCKPIT_HTTP_PORT:-8000}"
    volumes:
      # The verified canonical replica, read-only, at the path the replica module
      # already expects. Same host root the learning-plane jobs mount.
      - /var/lib/opip-learning/canonical-replica:/app/canonical-replica:ro
    networks:
      # The internal analytics network the Cockpit shares with the analytics plane, and
      # a dedicated non-internal network that makes the host publish work. Both are
      # required; see the network comments at the bottom of this file.
      opip-analytics:
      opip-cockpit-publish:
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    mem_limit: 256m
    memswap_limit: 256m
    cpus: "0.25"
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Container-local liveness only. This proves the process answers inside the
      # container; it does NOT prove operator reachability, which depends on the host
      # publish and the host reverse proxy. The bootstrap preflight proves that
      # separately, because a passing healthcheck here is not evidence of an
      # operator-reachable endpoint.
      test:
        - CMD-SHELL
        - python -c "import os,urllib.request,sys; port=os.environ.get('OPIP_COCKPIT_HTTP_PORT','8000'); sys.exit(0 if urllib.request.urlopen(f'http://127.0.0.1:{port}/cockpit', timeout=5).status==200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

networks:
  opip-analytics:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.29.0.0/24

  # Dedicated publish network. Used by opip-cockpit and nothing else.
  #
  # Why this exists: Docker Compose correctly declares the host publish on the service,
  # but a container attached ONLY to `internal: true` bridge networks receives no host
  # port mapping. On the production engine that surfaced exactly as:
  #
  #   docker port opip-cockpit                     => empty
  #   .NetworkSettings.Ports["8000/tcp"]           => null
  #   ss -ltnp | grep :8000                        => empty
  #
  # while the container itself was healthy. An internal bridge does not supply the
  # gateway/forwarding path Docker needs to install the requested mapping, so the
  # Cockpit had no host-loopback endpoint for the TLS reverse proxy to reach.
  #
  # Attaching a second, ordinary bridge gives Docker that path while leaving the
  # analytics network's `internal: true` isolation untouched. This is deliberately NOT
  # solved by relaxing `internal: true`, by binding 0.0.0.0, by `network_mode: host`, or
  # by any host-side forwarding shim: those would all widen exposure or hide the defect.
  #
  # No subnet is pinned: Docker allocates a non-conflicting one, so adding this network
  # cannot collide with the analytics subnet or with a host that already uses 172.29.x.
  opip-cockpit-publish:
    driver: bridge
    driver_opts:
      # Defense in depth only. This makes 127.0.0.1 the default host binding address for
      # any port published on this network, so a future service that forgets an explicit
      # loopback bind still cannot reach a public interface. It is NOT the primary
      # guarantee: the service-level port mapping is explicitly loopback, and
      # `cockpit_preflight` independently refuses any non-loopback or public listener at
      # runtime.
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"
      # Give back the egress the internal-only topology used to provide. An ordinary
      # bridge masquerades container traffic, so attaching one would hand the Cockpit
      # outbound Internet access it never had - a real capability increase even though its
      # inbound mapping stays loopback-only. Disabling masquerade removes that egress.
      #
      # It does NOT affect the publish: inbound host->container traffic is delivered by
      # Docker's proxy/DNAT to the container address and returns over the directly
      # connected bridge, so no NAT is involved. The container's reply goes back to the
      # gateway it is directly attached to. Only container-initiated egress needs
      # masquerade, and the Cockpit needs none: it serves reads from the mounted replica.
      #
      # Residual, stated honestly: a directly attached bridge still makes the gateway
      # address reachable at layer 2, so this removes Internet egress rather than all
      # host-reachability. That residual is inherent to any topology that can be
      # published, and the container's other controls (cap_drop ALL,
      # no-new-privileges, read-only rootfs, no credentials) bound what a compromise
      # could do with it.
      com.docker.network.bridge.enable_ip_masquerade: "false"
