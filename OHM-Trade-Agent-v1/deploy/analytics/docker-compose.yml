name: opip-data-platform

services:
  opip-postgres:
    image: postgres:17-alpine
    container_name: opip-postgres
    restart: unless-stopped
    env_file:
      - /etc/opip-data-platform.env
    environment:
      POSTGRES_DB: ${OPIP_POSTGRES_DB:-opip}
      POSTGRES_USER: ${OPIP_POSTGRES_ADMIN_USER:-opip_admin}
      POSTGRES_PASSWORD: ${OPIP_POSTGRES_ADMIN_PASSWORD:?set in /etc/opip-data-platform.env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    command:
      - postgres
      - -c
      - listen_addresses=*
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - effective_cache_size=768MB
      - -c
      - max_connections=25
      - -c
      - max_wal_size=1GB
      - -c
      - password_encryption=scram-sha-256
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    ports:
      - "${OPIP_POSTGRES_BIND_ADDRESS:-127.0.0.1}:5432:5432"
    volumes:
      - /var/lib/opip-data-platform/postgres:/var/lib/postgresql/data
      - /var/lib/opip-data-platform/config/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    networks:
      opip-analytics:
        ipv4_address: 172.29.0.2
    mem_limit: 512m
    memswap_limit: 512m
    cpus: "0.45"
    pids_limit: 192
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  opip-grafana:
    image: grafana/grafana:11.2.2
    container_name: opip-grafana
    restart: unless-stopped
    depends_on:
      opip-postgres:
        condition: service_healthy
    env_file:
      - /etc/opip-data-platform.env
    environment:
      GF_SERVER_HTTP_PORT: ${OPIP_GRAFANA_HTTP_PORT:-3000}
      GF_SERVER_ROOT_URL: ${OPIP_GRAFANA_ROOT_URL:-https://analytics.example.com/grafana}
      GF_SERVER_DOMAIN: ${OPIP_GRAFANA_DOMAIN:-analytics.example.com}
      GF_SERVER_SERVE_FROM_SUB_PATH: ${OPIP_GRAFANA_SERVE_FROM_SUB_PATH:-true}
      GF_SECURITY_ADMIN_USER: ${OPIP_GRAFANA_ADMIN_USER:?set in /etc/opip-data-platform.env}
      GF_SECURITY_ADMIN_PASSWORD: ${OPIP_GRAFANA_ADMIN_PASSWORD:?set in /etc/opip-data-platform.env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      OPIP_GRAFANA_DB_USER: ${OPIP_GRAFANA_DB_USER:-opip_dashboard}
      OPIP_GRAFANA_DB_PASSWORD: ${OPIP_GRAFANA_DB_PASSWORD:?set in /etc/opip-data-platform.env}
      OPIP_GRAFANA_DB_NAME: ${OPIP_GRAFANA_DB_NAME:-opip}
      OPIP_GRAFANA_DB_SSLMODE: ${OPIP_GRAFANA_DB_SSLMODE:-disable}
      OPIP_GRAFANA_POSTGRES_HOST: ${OPIP_GRAFANA_POSTGRES_HOST:-opip-postgres}
      OPIP_GRAFANA_POSTGRES_PORT: ${OPIP_GRAFANA_POSTGRES_PORT:-5432}
    ports:
      - "${OPIP_GRAFANA_BIND_ADDRESS:-127.0.0.1}:${OPIP_GRAFANA_HOST_PORT:-3000}:${OPIP_GRAFANA_HTTP_PORT:-3000}"
    volumes:
      - /var/lib/opip-data-platform/grafana:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/etc/grafana/provisioning/dashboards/json:ro
    networks:
      opip-analytics:
    user: "472"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/log/grafana:rw,noexec,nosuid,size=64m
    mem_limit: 256m
    memswap_limit: 256m
    cpus: "0.30"
    pids_limit: 192
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:${OPIP_GRAFANA_HTTP_PORT:-3000}/api/health | grep -q '"database":"ok"'
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  opip-shipper:
    build:
      context: ../..
    image: opip-data-platform:${OPIP_DEPLOYED_SHA:-local}
    container_name: opip-shipper
    restart: unless-stopped
    depends_on:
      opip-postgres:
        condition: service_healthy
    env_file:
      - /etc/opip-data-platform.env
    environment:
      OPIP_DATA_PLATFORM_SHIPPER_ENABLED: "true"
      OPIP_DATA_PLATFORM_DATA_ROOT: /data
      PYTHONDONTWRITEBYTECODE: "1"
    command:
      - python
      - -m
      - app.opip.data_platform.shipper
      - --watch
    volumes:
      - /var/lib/opip-learning/data:/data:ro
    networks:
      opip-analytics:
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    mem_limit: 128m
    memswap_limit: 128m
    cpus: "0.20"
    pids_limit: 96
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  opip-data-admin:
    profiles: ["admin"]
    build:
      context: ../..
    image: opip-data-platform:${OPIP_DEPLOYED_SHA:-local}
    depends_on:
      opip-postgres:
        condition: service_healthy
    env_file:
      - /etc/opip-data-platform.env
    environment:
      OPIP_DATA_PLATFORM_SHIPPER_ENABLED: "true"
      OPIP_DATA_PLATFORM_DATA_ROOT: /data
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - /var/lib/opip-learning/data:/data:ro
      - /var/backups/opip-postgres:/backups:rw
    networks:
      opip-analytics:
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    mem_limit: 256m
    memswap_limit: 256m
    cpus: "0.35"
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

networks:
  opip-analytics:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.29.0.0/24
