name: opip-data-platform

services:
  opip-postgres:
    image: postgres:17-alpine
    container_name: opip-postgres
    restart: unless-stopped
    env_file:
      - /etc/opip-data-platform.env
    environment:
      POSTGRES_DB: ${OPIP_POSTGRES_DB:-opip}
      POSTGRES_USER: ${OPIP_POSTGRES_ADMIN_USER:-opip_admin}
      POSTGRES_PASSWORD: ${OPIP_POSTGRES_ADMIN_PASSWORD:?set in /etc/opip-data-platform.env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    command:
      - postgres
      - -c
      - listen_addresses=*
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - effective_cache_size=768MB
      - -c
      - max_connections=25
      - -c
      - max_wal_size=1GB
      - -c
      - password_encryption=scram-sha-256
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - ssl=on
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - ssl_cert_file=/etc/postgresql/tls/server.crt
      - -c
      - ssl_key_file=/etc/postgresql/tls/server.key
    ports:
      - "${OPIP_POSTGRES_BIND_ADDRESS:-127.0.0.1}:5432:5432"
    volumes:
      - /var/lib/opip-data-platform/postgres:/var/lib/postgresql/data
      - /var/lib/opip-data-platform/config/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - /etc/opip-data-platform/tls/postgres-server.crt:/etc/postgresql/tls/server.crt:ro
      - /etc/opip-data-platform/tls/postgres-server.key:/etc/postgresql/tls/server.key:ro
    networks:
      opip-analytics:
        ipv4_address: 172.29.0.2
    mem_limit: 512m
    memswap_limit: 512m
    cpus: "0.45"
    pids_limit: 192
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  opip-grafana:
    image: grafana/grafana:13.2.1
    container_name: opip-grafana
    restart: unless-stopped
    depends_on:
      opip-postgres:
        condition: service_healthy
    env_file:
      - /etc/opip-grafana.env
    environment:
      GF_SERVER_HTTP_PORT: ${OPIP_GRAFANA_HTTP_PORT:-3000}
      GF_SERVER_ROOT_URL: ${OPIP_GRAFANA_ROOT_URL:-https://analytics.example.com/grafana}
      GF_SERVER_DOMAIN: ${OPIP_GRAFANA_DOMAIN:-analytics.example.com}
      GF_SERVER_SERVE_FROM_SUB_PATH: ${OPIP_GRAFANA_SERVE_FROM_SUB_PATH:-true}
      GF_SECURITY_ADMIN_USER: ${OPIP_GRAFANA_ADMIN_USER:?set in /etc/opip-data-platform.env}
      GF_SECURITY_ADMIN_PASSWORD: ${OPIP_GRAFANA_ADMIN_PASSWORD:?set in /etc/opip-data-platform.env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      OPIP_GRAFANA_DB_USER: ${OPIP_GRAFANA_DB_USER:-opip_dashboard}
      OPIP_GRAFANA_DB_PASSWORD: ${OPIP_GRAFANA_DB_PASSWORD:?set in /etc/opip-data-platform.env}
      OPIP_GRAFANA_DB_NAME: ${OPIP_GRAFANA_DB_NAME:-opip}
      OPIP_GRAFANA_DB_SSLMODE: ${OPIP_GRAFANA_DB_SSLMODE:-verify-full}
      OPIP_GRAFANA_POSTGRES_HOST: ${OPIP_GRAFANA_POSTGRES_HOST:-opip-postgres}
      OPIP_GRAFANA_POSTGRES_PORT: ${OPIP_GRAFANA_POSTGRES_PORT:-5432}
    ports:
      - "${OPIP_GRAFANA_BIND_ADDRESS:-127.0.0.1}:${OPIP_GRAFANA_HOST_PORT:-3000}:${OPIP_GRAFANA_HTTP_PORT:-3000}"
    volumes:
      - /var/lib/opip-data-platform/grafana:/var/lib/grafana
      - /etc/opip-data-platform/tls/postgres-ca.crt:/etc/grafana/certs/postgres-ca.crt:ro
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/etc/grafana/provisioning/dashboards/json:ro
    networks:
      opip-analytics:
    user: "472"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/log/grafana:rw,noexec,nosuid,size=64m
    mem_limit: 256m
    memswap_limit: 256m
    cpus: "0.30"
    pids_limit: 192
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:${OPIP_GRAFANA_HTTP_PORT:-3000}/api/health | grep -q '"database":"ok"'
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  opip-shipper:
    build:
      context: ../..
    image: opip-data-platform:${OPIP_DEPLOYED_SHA:-local}
    container_name: opip-shipper
    restart: unless-stopped
    depends_on:
      opip-postgres:
        condition: service_healthy
    env_file:
      - /etc/opip-data-platform.env
    environment:
      OPIP_DATA_PLATFORM_SHIPPER_ENABLED: "true"
      OPIP_DATA_PLATFORM_DATA_ROOT: /data
      PYTHONDONTWRITEBYTECODE: "1"
    command:
      - python
      - -m
      - app.opip.data_platform.shipper
      - --watch
    volumes:
      - /var/lib/opip-learning/data:/data:ro
      - /etc/opip-data-platform/tls/postgres-ca.crt:/etc/opip-data-platform/tls/postgres-ca.crt:ro
    networks:
      opip-analytics:
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    mem_limit: 128m
    memswap_limit: 128m
    cpus: "0.20"
    pids_limit: 96
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  # B/C-4 read-only Cockpit service.
  #
  # Serves the analytical Cockpit API on the analytics plane, where the verified
  # canonical replica is mounted. This is what keeps the Paper-v2 ledger/portfolio
  # workload off the trading host: the trading host has no replica, so it cannot
  # compute analytics even by misconfiguration.
  #
  # Reuses the existing repository image and the existing replica bridge; it adds no
  # droplet, database, scheduler or credentials. It runs the cockpit-only ASGI app
  # rather than the trading entry point, so this container cannot start trading
  # subsystems, and it holds no exchange or Telegram authority.
  #
  # Exposure mirrors the existing Grafana model: the service listens on the
  # container interface and is published ONLY to host loopback, where the host's TLS
  # reverse proxy terminates and forwards. The analytics network is internal, so
  # binding to loopback *inside* the container would be unreachable from the host and
  # from the proxy. Port 8000 is never published to a public interface.
  opip-cockpit:
    build:
      context: ../..
    image: opip-data-platform:${OPIP_DEPLOYED_SHA:-local}
    container_name: opip-cockpit
    restart: unless-stopped
    env_file:
      - /etc/opip-cockpit.env
    environment:
      # OPIP_CANONICAL_REPLICA_ROOT is deliberately NOT set here. Bootstrap writes it
      # into /etc/opip-cockpit.env, resolved to the committed generation under
      # `generations/<id>`: the mounted parent is a repository of generations selected
      # by a plain-text `current` pointer, so it holds no manifest and no canonical
      # database, and pinning it here would point the Cockpit at a directory that is
      # not a bundle. The application default (DEFAULT_REPLICA_ROOT,
      # /app/canonical-replica) still applies if the env file omits the key.
      OPIP_COCKPIT_HTTP_PORT: ${OPIP_COCKPIT_HTTP_PORT:-8000}
      PYTHONDONTWRITEBYTECODE: "1"
    command:
      - uvicorn
      - app.api.cockpit_service:app
      - --host
      - 0.0.0.0
      - --port
      - ${OPIP_COCKPIT_HTTP_PORT:-8000}
    ports:
      # Host-loopback only. The bind address is explicitly defaulted to 127.0.0.1 so
      # an unset variable can never widen exposure to a public interface.
      - "${OPIP_COCKPIT_BIND_ADDRESS:-127.0.0.1}:${OPIP_COCKPIT_HOST_PORT:-8000}:${OPIP_COCKPIT_HTTP_PORT:-8000}"
    volumes:
      # The verified canonical replica, read-only, at the path the replica module
      # already expects. Same host root the learning-plane jobs mount.
      - /var/lib/opip-learning/canonical-replica:/app/canonical-replica:ro
    networks:
      opip-analytics:
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    mem_limit: 256m
    memswap_limit: 256m
    cpus: "0.25"
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Container-local liveness only. This proves the process answers inside the
      # container; it does NOT prove operator reachability, which depends on the host
      # publish and the host reverse proxy. The bootstrap preflight proves that
      # separately, because a passing healthcheck here is not evidence of an
      # operator-reachable endpoint.
      test:
        - CMD-SHELL
        - python -c "import os,urllib.request,sys; port=os.environ.get('OPIP_COCKPIT_HTTP_PORT','8000'); sys.exit(0 if urllib.request.urlopen(f'http://127.0.0.1:{port}/cockpit', timeout=5).status==200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  opip-data-admin:
    profiles: ["admin"]
    build:
      context: ../..
    image: opip-data-platform:${OPIP_DEPLOYED_SHA:-local}
    depends_on:
      opip-postgres:
        condition: service_healthy
    env_file:
      - /etc/opip-data-platform.env
    environment:
      OPIP_DATA_PLATFORM_SHIPPER_ENABLED: "true"
      OPIP_DATA_PLATFORM_DATA_ROOT: /data
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - /var/lib/opip-learning/data:/data:ro
      - /var/backups/opip-postgres:/backups:rw
      - /etc/opip-data-platform/tls/postgres-ca.crt:/etc/opip-data-platform/tls/postgres-ca.crt:ro
    networks:
      opip-analytics:
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    mem_limit: 256m
    memswap_limit: 256m
    cpus: "0.35"
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

networks:
  opip-analytics:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.29.0.0/24
