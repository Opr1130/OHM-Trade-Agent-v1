# =============================================================================
# O'Pip — MISSION 07 V2 dashboard edge (MIGRATION-ONLY CONFIGURATION ARTIFACT)
# =============================================================================
# Derived from the certified deploy/nginx/dashboard-sidecar.conf at
#   c196dd674678b3b1ee91c351ee97c1c9e2b3938d
# Differences are limited to (a) the V2 server_name and (b) the V2 certificate
# directory. Every proxied location, method restriction, header and timeout is
# byte-for-byte equivalent to the certified file.
#
# Why sslip.io: V2 public IP 178.128.147.125 maps deterministically to
#   178-128-147-125.sslip.io
# so no DNS record and no DNS mutation is required (M2 §9).
#
# FAIL-CLOSED: nginx refuses to start when the certificate or key is absent, so
# a host without valid TLS material cannot serve the dashboard at all. It never
# degrades to plaintext and never falls back to the V1 certificate path.
#
# Read-only authority: only three GET surfaces are proxied. Everything else
# returns 404, so operator/trading endpoints are unreachable through the edge
# even though the core API listens on 127.0.0.1:8000 inside the host.
# =============================================================================

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    access_log /dev/stdout;
    server_tokens off;

    resolver 127.0.0.11 ipv6=off valid=10s;

    server {
        listen 8443 ssl;
        server_name 178-128-147-125.sslip.io;

        ssl_certificate /etc/letsencrypt/live/178-128-147-125.sslip.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/178-128-147-125.sslip.io/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:1m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        location = /dashboard {
            set $ohm_backend http://ohm-trade-agent:8000;
            proxy_pass $ohm_backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            add_header Cache-Control "no-store" always;
        }

        location = /dashboard/ {
            return 308 /dashboard;
        }

        location = /api/analytics/summary {
            limit_except GET {
                deny all;
            }
            set $ohm_backend http://ohm-trade-agent:8000;
            proxy_pass $ohm_backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            add_header Cache-Control "no-store" always;
        }

        location = /api/analytics/intelligence {
            limit_except GET {
                deny all;
            }
            set $ohm_backend http://ohm-trade-agent:8000;
            proxy_pass $ohm_backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            add_header Cache-Control "no-store" always;
        }

        location / {
            return 404;
        }
    }
}
