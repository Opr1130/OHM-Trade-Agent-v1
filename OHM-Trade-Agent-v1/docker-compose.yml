services:
  ohm-dashboard-edge:
    image: nginx:1.27-alpine
    container_name: ohm-dashboard-edge
    restart: unless-stopped
    ports:
      - "8443:8443"
    volumes:
      - ./deploy/nginx/dashboard-sidecar.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    read_only: true
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    entrypoint:
      - nginx
      - -g
      - daemon off;

  ohm-trade-agent:
    build: .
    container_name: ohm-trade-agent
    restart: unless-stopped
    depends_on:
      ohm-dashboard-edge:
        condition: service_started
    env_file:
      - .env
    environment:
      # O'Pip Sequence 2 production shadow activation.
      # Evidence collection only; the event store is not consumed by
      # qualification, ranking, alerts, paper admission, or exchange actions.
      OPIP_EVENT_STORE_ENABLED: "true"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      # Sequence 4 core-consumer boundary: streaming shadow evidence is
      # readable by the application but only the isolated worker may write it.
      - ./data/opip/streaming:/app/data/opip/streaming:ro
      - ./data/freqtrade/state:/app/freqtrade_paper:ro
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3); assert r.status == 200 and b'\"status\":\"ok\"' in r.read()"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  opip-stream-worker:
    build: .
    container_name: opip-stream-worker
    restart: unless-stopped
    environment:
      OPIP_STREAMING_ENABLED: "true"
      OPIP_STREAMING_SYMBOLS: "BTCUSDT,ETHUSDT,SOLUSDT"
      OPIP_STREAMING_BINANCE_URL: "wss://fstream.binance.com/market/stream"
      OPIP_STREAMING_BYBIT_URL: "wss://stream.bybit.com/v5/public/linear"
      OPIP_STREAMING_QUEUE_MAXSIZE: "5000"
      OPIP_STREAMING_RETENTION_HOURS: "72"
      OPIP_STREAMING_HEALTH_INTERVAL_SECONDS: "5"
      PYTHONDONTWRITEBYTECODE: "1"
    command:
      - python
      - -m
      - app.opip.streaming.worker
    volumes:
      - ./data:/app/data:ro
      - ./data/opip/streaming:/app/data/opip/streaming:rw
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    cpus: "0.40"
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-m",
          "app.opip.streaming.healthcheck"
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
