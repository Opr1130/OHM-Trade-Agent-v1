services:
  ohm-dashboard-edge:
    image: nginx:1.27-alpine
    container_name: ohm-dashboard-edge
    restart: unless-stopped
    ports:
      - "8443:8443"
    volumes:
      - ./deploy/nginx/dashboard-sidecar.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    read_only: true
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    entrypoint:
      - nginx
      - -g
      - daemon off;

  ohm-trade-agent:
    build: .
    container_name: ohm-trade-agent
    restart: unless-stopped
    depends_on:
      ohm-dashboard-edge:
        condition: service_started
    env_file:
      - .env
    environment:
      # O'Pip Sequence 2 production shadow activation.
      # Evidence collection only; the event store is not consumed by
      # qualification, ranking, alerts, paper admission, or exchange actions.
      OPIP_EVENT_STORE_ENABLED: "true"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./data/freqtrade/state:/app/freqtrade_paper:ro
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3); assert r.status == 200 and b'\"status\":\"ok\"' in r.read()"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
