# O'Pip Gitleaks configuration (advisory CI).
#
# Extends Gitleaks built-in rules and scans full history (`gitleaks detect`).
# Keep allowlists precise and justified. Never add a path-only or repo-wide
# exclusion, never disable a rule, and never relax the underlying detector.

title = "O'Pip advisory gitleaks config"

[extend]
useDefault = true

# ---------------------------------------------------------------------------
# Synthetic fixture text in the redaction test (one historical commit only).
#
# `test_opip_export_diagnostics_readonly_v1.py` proves that
# `redact_export_secrets()` removes credential material from production log
# output. An early revision of that fixture used values shaped like real tokens,
# which the generic-api-key rule correctly flags - a true positive against the
# fixture text, not a scanner defect.
#
# Those values have been replaced with obviously synthetic placeholders, so the
# current tree carries no such finding. The alert persists only because
# full-history scanning still sees the old blob.
#
# How the scope is expressed, and why each field is needed:
#
#   * `targetRules = ["generic-api-key"]` scopes this allowlist to that single
#     rule. Since v8.25.0 a top-level allowlist carrying `targetRules` is NOT
#     added to the global allowlist list; it is attached only to the named rules
#     (including rules pulled in via [extend] useDefault). `ruleIDs` is a
#     per-rule `[[rules.allowlists]]` field and is not valid here - using it
#     would leave the entry global while appearing scoped.
#
#   * `condition = "AND"` is required because allowlist criteria default to OR.
#     Under OR, `paths` alone would suppress every rule for this file and
#     `commits` alone would suppress every rule for this whole commit - both far
#     broader than intended. With AND, the finding is suppressed only when the
#     exact commit AND the exact path AND the targeted rule all match.
#
# Together these give the narrowest practical scope: one rule, one commit, one
# file. It cannot mask a real credential in another commit, another file, or
# under another rule, and it does not change the rule's severity or the
# advisory status of the job.
#
# Note on `regexes`: narrowing further to the two flagged values would mean
# reproducing credential-shaped literals inside the scanner's own configuration,
# which is self-defeating and could itself be matched. The rule+commit+path
# conjunction is the narrowest scope that avoids that trap.
# ---------------------------------------------------------------------------
[[allowlists]]
description = "Synthetic credential-shaped placeholders in the redaction test fixture at commit 16c493fa (non-functional test data, since replaced with clearly fake values)."
targetRules = ["generic-api-key"]
condition = "AND"
commits = ["16c493fa109c26979df0817f9676a2f028643b91"]
paths = ['''OHM-Trade-Agent-v1/tests/test_opip_export_diagnostics_readonly_v1\.py$''']

# ---------------------------------------------------------------------------
# Placeholder for the B/C-4 Cockpit operator-secret setting, commit f4e7a75c.
#
# `deploy/analytics/env.example` documents every setting an operator must supply,
# using `replace-with-...` markers. The Cockpit entry briefly used the marker
# `replace-with-the-existing-operator-secret-min-12-chars`, whose entropy (3.905)
# exceeded the generic-api-key threshold, so the rule correctly fired on a string
# that is not a credential. That is a true positive against the fixture text, not a
# scanner defect.
#
# The marker has been replaced with an obviously synthetic value (entropy 3.011), so
# the current tree carries no such finding, and a test asserts the placeholder stays
# below the threshold. The alert persists only because full-history scanning still
# sees the earlier blob.
#
# Same narrow scope and same reasoning as the entry above, for the same reasons:
# one rule, one commit, one file, AND-combined. It cannot mask a real credential in
# another commit, another file, or under another rule.
#
# `regexes` is deliberately not used: narrowing to the flagged literal would mean
# reproducing a credential-shaped string inside the scanner's own configuration,
# which is self-defeating and could itself be matched.
# ---------------------------------------------------------------------------
[[allowlists]]
description = "Non-credential placeholder marker for the Cockpit operator secret at commit f4e7a75c (env.example documentation value, since replaced with an obviously synthetic marker)."
targetRules = ["generic-api-key"]
condition = "AND"
commits = ["f4e7a75c3351dfa95574509975295c853720d5cc"]
paths = ['''OHM-Trade-Agent-v1/deploy/analytics/env\.example$''']

# ---------------------------------------------------------------------------
# Probe marker constant, commit 9e1b6a1b.
#
# `tests/test_bc4e4_cockpit_publish_network_v1.py` serves an index.html containing a
# marker and asserts the marker comes back over host loopback, which is what makes the
# Docker publish probe definitive rather than a bare TCP connect. The constant was
# first named `_PROBE_TOKEN` with a hyphenated value, and the generic-api-key rule
# correctly fired on that shape: a credential-named identifier with entropy 3.59
# against a run of non-words. That is a true positive against the fixture text, not a
# scanner defect.
#
# The constant has been renamed to a non-credential identifier holding a plain sentence,
# so the current tree carries no such finding. The alert persists only because
# full-history scanning still sees the earlier blob, and the earlier commit cannot be
# rewritten without force-pushing a branch under review for a test constant.
#
# Same narrow scope and same reasoning as the entries above: one rule, one commit, one
# file, AND-combined. It cannot mask a real credential in another commit, another file,
# or under another rule.
#
# `regexes` is deliberately not used: narrowing to the flagged literal would mean
# reproducing a credential-shaped string inside the scanner's own configuration, which
# is self-defeating and could itself be matched.
# ---------------------------------------------------------------------------
[[allowlists]]
description = "Non-credential probe marker constant at commit 9e1b6a1b (test fixture value, since renamed to a plain sentence with a non-credential identifier)."
targetRules = ["generic-api-key"]
condition = "AND"
commits = ["9e1b6a1b9b248bbc2d66bb36774b060c64f80609"]
paths = ['''OHM-Trade-Agent-v1/tests/test_bc4e4_cockpit_publish_network_v1\.py$''']

# ---------------------------------------------------------------------------
# Secret-like conformance fixtures, commit da73fdd8.
#
# `app/opip/committee/conformance.py` is the Phase-A corpus: a deterministic set
# of adversarial and valid payloads the model boundary must accept or refuse. One
# category exercises how the boundary treats secret-like content, and its first
# revision embedded credential-shaped literals (`api_key=...`, `password=...`,
# `token=...`) directly in source. The generic-api-key rule correctly fired on
# them: a true positive against the fixture text, not a scanner defect.
#
# The literals are now assembled at runtime from fragments, so the current tree
# carries no contiguous credential form and the fixtures still prove the same
# screening behaviour. This is the same remedy already applied to the outbound
# screening tests. The alert persists only because full-history scanning still
# sees the earlier blob, and that commit should not be rewritten while the branch
# is under review.
#
# Same narrow scope and same reasoning as the entries above: one rule, one commit,
# one file, AND-combined. It cannot mask a real credential in another commit,
# another file, or under another rule.
#
# `regexes` is deliberately not used: narrowing to the flagged values would mean
# reproducing credential-shaped strings inside the scanner's own configuration,
# which is self-defeating and could itself be matched.
# ---------------------------------------------------------------------------
[[allowlists]]
description = "Synthetic credential-shaped fixtures in the Phase-A conformance corpus at commit da73fdd8 (test data, since assembled at runtime from fragments so no contiguous credential form remains in source)."
targetRules = ["generic-api-key"]
condition = "AND"
commits = ["da73fdd814dd38331d9ddc9088802677343e4acc"]
paths = ['''OHM-Trade-Agent-v1/app/opip/committee/conformance\.py$''']
